<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano de Vida — Fábio Gandini · 2026–2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#1c3a2e;
  --pine-2:#2a4f3e;
  --pine-3:#3d6a52;
  --paper:#f4f5f0;
  --card:#ffffff;
  --ink:#242821;
  --ink-soft:#5a6154;
  --line:#dfe3d9;
  --amber:#b8860f;
  --amber-soft:#f5ead0;
  --moss:#7c9070;
  --moss-soft:#eaf0e6;
  --danger:#a04b3a;
  --radius:14px;
  font-size:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Public Sans','Noto Sans JP',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
body.lang-ja{font-family:'Noto Sans JP','Public Sans',sans-serif}
/* ---------- Header / Norte ---------- */
header{
  background:
    radial-gradient(circle at 85% -40%, rgba(255,255,255,.10) 0 90px, transparent 91px),
    radial-gradient(circle at 85% -40%, rgba(255,255,255,.07) 0 160px, transparent 161px),
    radial-gradient(circle at 85% -40%, rgba(255,255,255,.05) 0 240px, transparent 241px),
    radial-gradient(circle at 85% -40%, rgba(255,255,255,.04) 0 330px, transparent 331px),
    var(--pine);
  color:#f2f1e8;
  padding:26px 20px 28px;
}
.wrap{max-width:780px;margin:0 auto}
.lang-row{display:flex;justify-content:flex-end;gap:6px;margin-bottom:14px}
.lang-btn{
  border:1px solid rgba(255,255,255,.35);background:transparent;color:#dfe6d5;
  font:inherit;font-size:.72rem;font-weight:700;letter-spacing:.06em;
  padding:5px 12px;border-radius:999px;cursor:pointer;
}
.lang-btn.active{background:#f2f1e8;color:var(--pine);border-color:#f2f1e8}
.lang-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.eyebrow{
  font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;
  color:#cfd8c6;font-weight:600;margin-bottom:6px;
}
header h1{
  font-family:'Fraunces',Georgia,serif;
  font-weight:600;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.15;
}
.verse{
  margin-top:14px;font-family:'Fraunces',Georgia,serif;font-style:italic;
  font-size:1rem;color:#e4e6d6;max-width:620px;
}
.verse textarea{
  width:100%;background:transparent;border:none;border-bottom:1px dashed rgba(255,255,255,.35);
  color:#e4e6d6;font:inherit;padding:2px 0;resize:none;overflow:hidden;
}
.verse textarea:focus{outline:none;border-bottom-color:#fff}
.norte{
  margin-top:22px;display:grid;gap:10px;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
}
.norte-item{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.16);
  border-radius:12px;padding:12px 14px;
}
.norte-item .tag{
  font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--amber-soft);font-weight:700;margin-bottom:4px;display:block;
}
.norte-item textarea{
  width:100%;background:transparent;border:none;resize:none;color:#f2f1e8;
  font-family:'Fraunces',Georgia,serif;font-size:.95rem;line-height:1.4;overflow:hidden;
}
body.lang-ja .norte-item textarea{font-family:'Noto Sans JP',serif}
.norte-item textarea:focus{outline:none}
.norte-note{margin-top:10px;font-size:.72rem;color:#b9c4ae}
/* ---------- Tabs ---------- */
nav{
  position:sticky;top:0;z-index:50;background:var(--paper);
  border-bottom:1px solid var(--line);
}
.tabs{
  max-width:780px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;
  padding:8px 12px;
}
.tab{
  border:none;background:transparent;font:inherit;font-weight:600;font-size:.85rem;
  color:var(--ink-soft);padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;
}
.tab:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.tab.active{background:var(--pine);color:#fff}
main{max-width:780px;margin:0 auto;padding:22px 16px 80px}
section.panel{display:none}
section.panel.active{display:block}
h2{
  font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.35rem;margin:6px 0 4px;
}
body.lang-ja h2{font-family:'Noto Sans JP',serif;font-weight:700}
.sub{color:var(--ink-soft);font-size:.88rem;margin-bottom:18px}
/* ---------- Cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 16px;margin-bottom:16px;
}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.card-head h3{
  font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.12rem;flex:1;
}
body.lang-ja .card-head h3{font-family:'Noto Sans JP',serif;font-weight:700}
.badge{
  font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;
}
.badge.agora{background:var(--amber-soft);color:#7a5a0a;border:1px solid #e3cf9c}
.badge.sondar{background:var(--moss-soft);color:#48603e;border:1px solid #c6d4bd}
.field{margin-bottom:12px}
.field label{
  display:block;font-size:.68rem;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;
}
textarea.grow, input.txt{
  width:100%;border:1px solid var(--line);border-radius:10px;background:#fbfbf8;
  font:inherit;font-size:.92rem;padding:10px 12px;color:var(--ink);resize:none;overflow:hidden;
}
textarea.grow:focus, input.txt:focus{outline:2px solid var(--pine-3);border-color:transparent}
/* actions */
.acoes{list-style:none;margin-top:4px}
.acao{
  display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px dashed var(--line);
}
.acao input[type=checkbox]{
  width:19px;height:19px;margin-top:6px;accent-color:var(--pine);flex-shrink:0;cursor:pointer;
}
.acao .a-main{flex:1;display:flex;flex-direction:column;gap:4px}
.acao textarea{border:none;background:transparent;padding:4px 2px;font-size:.92rem;font-family:inherit}
.acao.done textarea.a-txt{text-decoration:line-through;color:var(--ink-soft)}
.acao input.prazo{
  border:none;background:transparent;font-size:.72rem;color:var(--amber);
  font-weight:600;padding:0 2px;width:100%;font-family:inherit;
}
.acao input.prazo::placeholder{color:#c4b98f}
.a-del{
  border:none;background:transparent;color:#b9beb2;font-size:1rem;cursor:pointer;
  padding:6px;margin-top:2px;border-radius:6px;
}
.a-del:hover{color:var(--danger);background:#f7ecea}
.add-acao{
  margin-top:10px;border:1px dashed var(--pine-3);background:transparent;color:var(--pine-2);
  font:inherit;font-size:.82rem;font-weight:600;border-radius:999px;padding:7px 16px;cursor:pointer;
}
.add-acao:hover{background:var(--moss-soft)}
.progress{
  height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 2px;
}
.progress i{display:block;height:100%;background:var(--pine-3);border-radius:99px;transition:width .3s}
.prog-label{font-size:.7rem;color:var(--ink-soft)}
/* ---------- Horizontes ---------- */
.trilha{position:relative;padding-left:26px;margin-top:8px}
.trilha:before{
  content:"";position:absolute;left:8px;top:10px;bottom:10px;width:2px;
  background:linear-gradient(var(--pine-3),var(--amber));border-radius:2px;
}
.h-item{position:relative;margin-bottom:18px}
.h-item:before{
  content:"";position:absolute;left:-24px;top:8px;width:12px;height:12px;border-radius:50%;
  background:var(--paper);border:3px solid var(--pine-3);
}
.h-item.far:before{border-color:var(--amber)}
/* ---------- Peso ---------- */
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stat{
  flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 14px;
}
.stat b{font-family:'Fraunces',Georgia,serif;font-size:1.4rem;font-weight:600;display:block}
.stat span{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);font-weight:600}
table.peso{width:100%;border-collapse:collapse}
table.peso th{
  text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;
  color:var(--ink-soft);padding:6px 8px;border-bottom:1px solid var(--line);
}
table.peso td{padding:4px 4px;border-bottom:1px dashed var(--line)}
table.peso input{
  width:100%;border:none;background:transparent;font:inherit;font-size:.9rem;padding:6px 4px;
}
table.peso input:focus{outline:2px solid var(--pine-3);border-radius:6px}
.mini-btn{
  border:none;background:transparent;color:#b9beb2;cursor:pointer;font-size:1rem;padding:4px 8px;border-radius:6px;
}
.mini-btn:hover{color:var(--danger);background:#f7ecea}
/* ---------- checkins ---------- */
.checkin{border-left:4px solid var(--amber)}
.checkin .card-head h3{font-size:1rem}
/* ---------- dados ---------- */
.btn{
  display:inline-block;border:none;border-radius:999px;padding:11px 22px;font:inherit;
  font-weight:600;font-size:.88rem;cursor:pointer;margin:0 8px 10px 0;
}
.btn.primary{background:var(--pine);color:#fff}
.btn.primary:hover{background:var(--pine-2)}
.btn.ghost{background:transparent;border:1.5px solid var(--pine);color:var(--pine)}
.btn.warn{background:transparent;border:1.5px solid var(--danger);color:var(--danger)}
.save-pill{
  position:fixed;bottom:16px;right:16px;background:var(--pine);color:#fff;
  font-size:.72rem;font-weight:600;padding:7px 14px;border-radius:999px;
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:60;
}
.save-pill.show{opacity:.92}
.note{
  background:var(--amber-soft);border:1px solid #e3cf9c;border-radius:12px;
  padding:12px 14px;font-size:.83rem;color:#6b520f;margin-bottom:18px;
}
.lang-hint{font-size:.78rem;color:var(--ink-soft);margin-bottom:14px}
footer{
  max-width:780px;margin:0 auto;padding:0 16px 40px;color:var(--ink-soft);font-size:.75rem;
}
/* ---------- print ---------- */
@media print{
  nav,.save-pill,.add-acao,.a-del,.mini-btn,#addPeso,.btn,.note,.lang-row{display:none!important}
  section.panel{display:block!important;page-break-after:always}
  body{background:#fff}
  header{background:var(--pine)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card{break-inside:avoid}
  textarea.grow,input.txt{border-color:#ccc;background:#fff}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="lang-row" role="group" aria-label="Idioma / Language / 言語">
      <button class="lang-btn" data-lang="pt">PT</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ja">日本語</button>
    </div>
    <div class="eyebrow" data-ui="eyebrow"></div>
    <h1>Fábio Gandini</h1>
    <div class="verse"><textarea id="versiculo" rows="2" aria-label="Versículo"></textarea></div>
    <div class="norte" id="norteBox">
      <div class="norte-item"><span class="tag" data-ui="tagPai"></span><textarea data-norte="pai" rows="2"></textarea></div>
      <div class="norte-item"><span class="tag" data-ui="tagMarido"></span><textarea data-norte="marido" rows="2"></textarea></div>
      <div class="norte-item"><span class="tag" data-ui="tagFe"></span><textarea data-norte="fe" rows="2"></textarea></div>
    </div>
    <div class="norte-note" data-ui="norteNote"></div>
  </div>
</header>

<nav>
  <div class="tabs" role="tablist">
    <button class="tab active" data-panel="p-ano" role="tab" data-ui="tabAno"></button>
    <button class="tab" data-panel="p-horiz" role="tab" data-ui="tabHoriz"></button>
    <button class="tab" data-panel="p-acomp" role="tab" data-ui="tabAcomp"></button>
    <button class="tab" data-panel="p-dados" role="tab" data-ui="tabDados"></button>
  </div>
</nav>

<main>

<!-- ============ PLANO 1 ANO ============ -->
<section class="panel active" id="p-ano">
  <h2 data-ui="anoH2"></h2>
  <p class="sub" data-ui="anoSub"></p>
  <div id="areasBox"></div>
</section>

<!-- ============ HORIZONTES ============ -->
<section class="panel" id="p-horiz">
  <h2 data-ui="horizH2"></h2>
  <p class="sub" data-ui="horizSub"></p>
  <div class="trilha" id="horizBox"></div>
</section>

<!-- ============ ACOMPANHAMENTO ============ -->
<section class="panel" id="p-acomp">
  <h2 data-ui="acompH2"></h2>
  <p class="sub" data-ui="acompSub"></p>

  <div class="stats">
    <div class="stat"><span data-ui="stUltimoL"></span><b id="stUltimo">—</b></div>
    <div class="stat"><span data-ui="stDeltaL"></span><b id="stDelta">—</b></div>
    <div class="stat"><span data-ui="stDataL"></span><b id="stData" style="font-size:1rem;line-height:2.1">—</b></div>
  </div>

  <div class="card">
    <div class="card-head"><h3 data-ui="pesoTitulo"></h3></div>
    <table class="peso">
      <thead><tr><th style="width:45%" data-ui="thData"></th><th data-ui="thPeso"></th><th style="width:60px" data-ui="thNota"></th><th></th></tr></thead>
      <tbody id="pesoBody"></tbody>
    </table>
    <button class="add-acao" id="addPeso"></button>
  </div>

  <div id="checkinsBox"></div>
</section>

<!-- ============ DADOS ============ -->
<section class="panel" id="p-dados">
  <h2 data-ui="dadosH2"></h2>
  <p class="sub" data-ui="dadosSub"></p>
  <p class="lang-hint" data-ui="langHint"></p>
  <div class="note" data-ui="dadosNote"></div>
  <button class="btn primary" id="btnExport"></button>
  <button class="btn ghost" id="btnImport"></button>
  <button class="btn ghost" onclick="window.print()" data-ui="btnPrint"></button>
  <button class="btn warn" id="btnReset"></button>
  <input type="file" id="fileImport" accept="application/json" style="display:none">
</section>

</main>

<footer data-ui="footer"></footer>
<div class="save-pill" id="savePill"></div>

/* ---------- storage + migração v1→v2 ---------- */
const KEY = "plano-vida-gandini-v1";
let memStore = null;

function wrap(v){ return (typeof v === "string") ? { pt:v, en:"", ja:"" } : v; }
function migrate(st){
  if(!st || st.versao >= 2) return st;
  st.versao = 2;
  st.lang = st.lang || "pt";
  st.versiculo = wrap(st.versiculo);
  Object.keys(st.norte||{}).forEach(k=> st.norte[k] = wrap(st.norte[k]));
  (st.horizontes||[]).forEach(h=>{ h.titulo=wrap(h.titulo); h.texto=wrap(h.texto); });
  (st.areas||[]).forEach(a=>{
    a.nome=wrap(a.nome); a.ondeEstou=wrap(a.ondeEstou); a.ondeVou=wrap(a.ondeVou);
    (a.acoes||[]).forEach(ac=>{ ac.t=wrap(ac.t); ac.prazo=wrap(ac.prazo); });
  });
  (st.checkins||[]).forEach(c=> c.titulo=wrap(c.titulo));
  return st;
}
function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return migrate(JSON.parse(raw));
  }catch(e){ /* preview sem localStorage */ }
  return memStore ? JSON.parse(JSON.stringify(memStore)) : JSON.parse(JSON.stringify(DEFAULT_STATE));
}
let saveTimer;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ memStore = JSON.parse(JSON.stringify(S)); }
    const p = document.getElementById("savePill");
    p.classList.add("show");
    setTimeout(()=>p.classList.remove("show"), 1200);
  }, 400);
}
let S = loadState();

/* ---------- helpers de idioma ---------- */
function T(){ return L[S.lang] || L.pt; }
function val(field){
  if(!field) return "";
  const v = field[S.lang];
  return (v && v.trim()) ? v : (field.pt || "");
}
function setVal(field, v){ field[S.lang] = v; }

function autoGrow(el){ el.style.height="auto"; el.style.height=(el.scrollHeight+2)+"px"; }
function mkTextarea(cls, field, rows){
  const t=document.createElement("textarea");
  t.className=cls; t.value=val(field); t.rows=rows||1;
  t.addEventListener("input",()=>{ autoGrow(t); setVal(field, t.value); saveState(); });
  requestAnimationFrame(()=>autoGrow(t));
  return t;
}
function mkPlainTextarea(cls, obj, key, rows){
  const t=document.createElement("textarea");
  t.className=cls; t.value=obj[key]||""; t.rows=rows||1;
  t.addEventListener("input",()=>{ autoGrow(t); obj[key]=t.value; saveState(); });
  requestAnimationFrame(()=>autoGrow(t));
  return t;
}
function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- interface estática ---------- */
function applyUI(){
  const t=T();
  document.body.className = "lang-" + S.lang;
  document.documentElement.lang = S.lang==="pt" ? "pt-BR" : S.lang;
  document.querySelectorAll("[data-ui]").forEach(el=>{
    const k=el.dataset.ui;
    if(typeof t[k]==="string") el.textContent=t[k];
  });
  document.getElementById("addPeso").textContent=t.addPeso;
  document.getElementById("btnExport").textContent=t.btnExport;
  document.getElementById("btnImport").textContent=t.btnImport;
  document.getElementById("btnReset").textContent=t.btnReset;
  document.getElementById("savePill").textContent=t.savePill;
  document.querySelectorAll(".lang-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.lang===S.lang);
  });
}
document.querySelectorAll(".lang-btn").forEach(b=>{
  b.addEventListener("click",()=>{
    S.lang=b.dataset.lang;
    saveState();
    renderAll();
  });
});

/* ---------- header: versículo + norte ---------- */
function renderHeader(){
  const box=document.querySelector(".verse");
  box.innerHTML="";
  const t=mkTextarea("", S.versiculo, 2);
  t.id="versiculo"; t.setAttribute("aria-label","Versículo");
  box.appendChild(t);
  document.querySelectorAll("#norteBox textarea").forEach(el=>{
    const k=el.dataset.norte;
    const field=S.norte[k];
    el.value=val(field);
    el.oninput=()=>{ autoGrow(el); setVal(field, el.value); saveState(); };
    requestAnimationFrame(()=>autoGrow(el));
  });
}

/* ---------- áreas ---------- */
function renderAreas(){
  const t=T();
  const box=document.getElementById("areasBox");
  box.innerHTML="";
  S.areas.forEach(area=>{
    const card=document.createElement("div");
    card.className="card";
    const done=area.acoes.filter(a=>a.done).length, tot=area.acoes.length;
    card.innerHTML=`
      <div class="card-head">
        <h3>${esc(val(area.nome))}</h3>
        <span class="badge ${area.prioridade}">${area.prioridade==="agora"?t.badgeAgora:t.badgeSondar}</span>
      </div>
      <div class="progress"><i style="width:${tot?Math.round(done/tot*100):0}%"></i></div>
      <div class="prog-label">${t.prog(done,tot)}</div>`;
    const f1=document.createElement("div"); f1.className="field";
    f1.innerHTML=`<label>${t.fOnde}</label>`;
    f1.appendChild(mkTextarea("grow", area.ondeEstou, 2));
    const f2=document.createElement("div"); f2.className="field";
    f2.innerHTML=`<label>${t.fVou}</label>`;
    f2.appendChild(mkTextarea("grow", area.ondeVou, 2));
    card.appendChild(f1); card.appendChild(f2);

    const lbl=document.createElement("div"); lbl.className="field";
    lbl.innerHTML=`<label>${t.fAcoes}</label>`;
    card.appendChild(lbl);

    const ul=document.createElement("ul"); ul.className="acoes";
    area.acoes.forEach((a,idx)=>{
      const li=document.createElement("li");
      li.className="acao"+(a.done?" done":"");
      const cb=document.createElement("input");
      cb.type="checkbox"; cb.checked=a.done;
      cb.setAttribute("aria-label", val(a.t));
      cb.addEventListener("change",()=>{ a.done=cb.checked; saveState(); renderAreas(); });
      const main=document.createElement("div"); main.className="a-main";
      main.appendChild(mkTextarea("a-txt", a.t, 1));
      const pz=document.createElement("input");
      pz.className="prazo"; pz.value=val(a.prazo); pz.placeholder=t.prazoPh;
      pz.addEventListener("input",()=>{ setVal(a.prazo, pz.value); saveState(); });
      main.appendChild(pz);
      const del=document.createElement("button");
      del.className="a-del"; del.textContent="✕";
      del.addEventListener("click",()=>{ area.acoes.splice(idx,1); saveState(); renderAreas(); });
      li.appendChild(cb); li.appendChild(main); li.appendChild(del);
      ul.appendChild(li);
    });
    card.appendChild(ul);
    const add=document.createElement("button");
    add.className="add-acao"; add.textContent=t.addAcao;
    add.addEventListener("click",()=>{
      area.acoes.push({ t:{pt:"",en:"",ja:""}, prazo:{pt:"",en:"",ja:""}, done:false });
      saveState(); renderAreas();
    });
    card.appendChild(add);
    box.appendChild(card);
  });
}

/* ---------- horizontes ---------- */
function renderHoriz(){
  const box=document.getElementById("horizBox");
  box.innerHTML="";
  S.horizontes.forEach(h=>{
    const item=document.createElement("div");
    item.className="h-item"+(h.far?" far":"");
    const card=document.createElement("div"); card.className="card";
    card.innerHTML=`<div class="card-head"><h3>${esc(val(h.titulo))}</h3></div>`;
    card.appendChild(mkTextarea("grow", h.texto, 2));
    item.appendChild(card);
    box.appendChild(item);
  });
}

/* ---------- peso (compartilhado entre idiomas) ---------- */
function renderPeso(){
  const body=document.getElementById("pesoBody");
  body.innerHTML="";
  const sorted=[...S.peso].sort((a,b)=>(a.data||"").localeCompare(b.data||""));
  S.peso=sorted;
  sorted.forEach((p,idx)=>{
    const tr=document.createElement("tr");
    const tdD=document.createElement("td");
    const inD=document.createElement("input"); inD.type="date"; inD.value=p.data||"";
    inD.addEventListener("change",()=>{ p.data=inD.value; saveState(); renderPeso(); });
    tdD.appendChild(inD);
    const tdK=document.createElement("td");
    const inK=document.createElement("input"); inK.type="number"; inK.step="0.05"; inK.value=p.kg||"";
    inK.placeholder="kg";
    inK.addEventListener("input",()=>{ p.kg=inK.value; saveState(); stats(); });
    tdK.appendChild(inK);
    const tdN=document.createElement("td");
    const inN=document.createElement("input"); inN.type="text"; inN.value=p.nota||""; inN.placeholder="…";
    inN.addEventListener("input",()=>{ p.nota=inN.value; saveState(); });
    tdN.appendChild(inN);
    const tdX=document.createElement("td");
    const del=document.createElement("button"); del.className="mini-btn"; del.textContent="✕";
    del.addEventListener("click",()=>{ S.peso.splice(idx,1); saveState(); renderPeso(); });
    tdX.appendChild(del);
    tr.appendChild(tdD); tr.appendChild(tdK); tr.appendChild(tdN); tr.appendChild(tdX);
    body.appendChild(tr);
  });
  stats();
}
function stats(){
  const valid=S.peso.filter(p=>p.kg && p.data).sort((a,b)=>a.data.localeCompare(b.data));
  const stU=document.getElementById("stUltimo"), stD=document.getElementById("stDelta"), stDt=document.getElementById("stData");
  if(!valid.length){ stU.textContent="—"; stD.textContent="—"; stDt.textContent="—"; return; }
  const first=parseFloat(valid[0].kg), last=parseFloat(valid[valid.length-1].kg);
  const dec = S.lang==="pt" ? (n)=>n.toFixed(1).replace(".",",") : (n)=>n.toFixed(1);
  stU.textContent=dec(last)+" kg";
  const d=last-first;
  stD.textContent=(d>0?"+":"")+dec(d)+" kg";
  stD.style.color = d<0 ? "var(--pine-3)" : (d>0 ? "var(--danger)" : "var(--ink)");
  const [y,m,dd]=valid[valid.length-1].data.split("-");
  stDt.textContent = S.lang==="ja" ? `${y}年${parseInt(m)}月${parseInt(dd)}日`
                    : S.lang==="en" ? `${m}/${dd}/${y}`
                    : `${dd}/${m}/${y}`;
}
document.getElementById("addPeso").addEventListener("click",()=>{
  const hoje=new Date().toISOString().slice(0,10);
  S.peso.push({data:hoje,kg:"",nota:""});
  saveState(); renderPeso();
});

/* ---------- check-ins (títulos traduzidos, respostas compartilhadas) ---------- */
function renderCheckins(){
  const t=T();
  const box=document.getElementById("checkinsBox");
  box.innerHTML="";
  S.checkins.forEach(c=>{
    const card=document.createElement("div");
    card.className="card checkin";
    card.innerHTML=`<div class="card-head"><h3>${esc(val(c.titulo))}</h3></div>`;
    const f1=document.createElement("div"); f1.className="field";
    f1.innerHTML=`<label>${t.ciFeito}</label>`;
    f1.appendChild(mkPlainTextarea("grow", c, "feito", 2));
    const f2=document.createElement("div"); f2.className="field";
    f2.innerHTML=`<label>${t.ciTravou}</label>`;
    f2.appendChild(mkPlainTextarea("grow", c, "travou", 2));
    const f3=document.createElement("div"); f3.className="field";
    f3.innerHTML=`<label>${t.ciProximo}</label>`;
    f3.appendChild(mkPlainTextarea("grow", c, "proximo", 2));
    card.appendChild(f1); card.appendChild(f2); card.appendChild(f3);
    box.appendChild(card);
  });
}

/* ---------- tabs ---------- */
document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(tab.dataset.panel).classList.add("active");
    document.querySelectorAll(".panel.active textarea").forEach(x=>autoGrow(x));
    window.scrollTo({top:0});
  });
});

/* ---------- dados: export / import / reset ---------- */
document.getElementById("btnExport").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  const d=new Date().toISOString().slice(0,10);
  a.download=`plano-de-vida-gandini-${d}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById("btnImport").addEventListener("click",()=>document.getElementById("fileImport").click());
document.getElementById("fileImport").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=migrate(JSON.parse(r.result));
      if(!data.areas || !data.norte) throw new Error("estrutura inválida");
      S=data; saveState(); renderAll();
      alert(T().importOk);
    }catch(err){ alert(T().importErr); }
  };
  r.readAsText(f);
  e.target.value="";
});
document.getElementById("btnReset").addEventListener("click",()=>{
  if(confirm(T().resetConfirm)){
    const lang=S.lang;
    S=JSON.parse(JSON.stringify(DEFAULT_STATE));
    S.lang=lang;
    saveState(); renderAll();
  }
});

/* ---------- boot ---------- */
function renderAll(){
  applyUI(); renderHeader(); renderAreas(); renderHoriz(); renderPeso(); renderCheckins();
}
renderAll();
