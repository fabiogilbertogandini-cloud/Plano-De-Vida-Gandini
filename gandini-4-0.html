<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0C0F14">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gandini 4.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>
<style>
  :root{
    --bg: #0C0F14;
    --surface: #151A22;
    --surface-2: #1C222C;
    --border: #262E3A;
    --ink: #EDE9DF;
    --ink-dim: #9AA3B2;
    --ink-faint: #5C6472;
    --amber: #D6A75A;
    --amber-dim: #8A6E3E;
    --sage: #6FA98C;
    --sage-dim: #3A4A42;
    --coral: #C7715C;
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;}
  body{ padding-bottom: 60px; min-height:100vh; }
  ::selection{ background: var(--amber-dim); }

  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; margin:0; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  #gate{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px; padding:24px;
  }
  #gate .mark{ font-family:'Fraunces',serif; font-size:15px; letter-spacing:0.18em; color:var(--amber); text-transform:uppercase; }
  #gate h1{ font-size:32px; color:var(--ink); }
  #gate input{
    background:var(--surface); border:1px solid var(--border); color:var(--ink);
    padding:14px 16px; border-radius:10px; font-size:16px; width:100%; max-width:280px; text-align:center;
    font-family:'IBM Plex Mono',monospace; letter-spacing:0.1em;
  }
  #gate input:focus{ outline:none; border-color:var(--amber); }
  #gate button{
    background:var(--amber); color:#1A1508; border:none; padding:13px 28px; border-radius:10px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:15px; cursor:pointer; width:100%; max-width:280px;
  }
  #gate .err{ color:var(--coral); font-size:13px; height:16px; }
  #app{ display:none; }

  header.top{ padding: 24px 20px 8px; text-align:center; }
  .eyebrow{ font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--amber); margin-bottom:6px; }
  .verse{ font-size:12px; color:var(--ink-faint); font-style:italic; margin-top:4px; }

  .lang-row{ display:flex; justify-content:center; gap:6px; margin: 10px 0 2px; }
  .lang-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:5px 11px; border-radius:20px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink-dim); cursor:pointer;
  }
  .lang-btn.active{ background:var(--amber); color:#1A1508; border-color:var(--amber); font-weight:600; }

  .arc-wrap{ display:flex; justify-content:center; margin: 10px 0 4px; }
  .arc-pct{ font-family:'Fraunces',serif; font-size:30px; }
  .arc-label{ font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.1em; }

  .tabs{ display:flex; gap:8px; padding: 10px 20px 16px; max-width:520px; margin:0 auto; }
  .tab{
    flex:1; text-align:center; padding:10px 0; border-radius:10px; font-size:13px; font-weight:600;
    background:var(--surface); color:var(--ink-dim); cursor:pointer; border:1px solid var(--border);
  }
  .tab.active{ background:var(--amber); color:#1A1508; border-color:var(--amber); }

  main{ max-width:520px; margin:0 auto; padding: 0 16px; }
  .view{ display:none; }
  .view.active{ display:block; }

  .section{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; }
  .section-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; }
  .section-head .st{ display:flex; align-items:center; gap:10px; }
  .section-head .time{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--amber); background:rgba(214,167,90,0.1); padding:3px 8px; border-radius:6px; }
  .section-title{ font-size:15px; font-weight:600; font-family:'Inter',sans-serif; }
  .section-body{ padding: 0 16px 14px; }

  .task-row{ padding:9px 0; border-top:1px solid var(--border); }
  .task-row:first-child{ border-top:none; }
  .task-row-main{ display:flex; align-items:center; gap:12px; }
  .task-note-inline{ font-size:11.5px; color:var(--ink-faint); padding: 4px 0 0 36px; line-height:1.5; font-style:italic; }

  .check{
    width:24px; height:24px; border-radius:7px; border:2px solid var(--ink-faint); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition: all .15s ease;
  }
  .check.done{ background:var(--sage); border-color:var(--sage); }
  .check svg{ width:14px; height:14px; opacity:0; transition: opacity .1s; }
  .check.done svg{ opacity:1; }
  .task-label{ font-size:14px; flex:1; }
  .task-row.done .task-label{ color:var(--ink-dim); text-decoration: line-through; text-decoration-color: var(--ink-faint); }

  .water-box{ display:flex; align-items:center; gap:14px; padding: 4px 0 8px; }
  .water-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2);
    color:var(--ink); font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .water-fill{ flex:1; }
  .water-bar{ height:10px; background:var(--surface-2); border-radius:6px; overflow:hidden; border:1px solid var(--border); }
  .water-bar-in{ height:100%; background: linear-gradient(90deg, var(--amber-dim), var(--amber)); width:0%; transition: width .2s; }
  .water-txt{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-dim); margin-top:6px; }

  .info-card{ background:var(--surface-2); border:1px dashed var(--border); border-radius:10px; padding:12px 14px; font-size:12.5px; color:var(--ink-dim); line-height:1.6; margin-bottom:14px; }
  .info-card b{ color:var(--ink); }

  .undo-row{ display:flex; justify-content:flex-end; padding: 6px 16px 16px; }
  .undo-btn{ font-size:12px; color:var(--ink-faint); background:none; border:none; text-decoration:underline; cursor:pointer; padding:4px; }

  .week-grid{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:14px; overflow-x:auto; }
  table.wk{ width:100%; border-collapse:collapse; font-size:12px; }
  table.wk th{ font-weight:600; color:var(--ink-dim); padding:6px 4px; text-align:center; font-size:11px; }
  table.wk td{ text-align:center; padding:8px 4px; }
  table.wk td.label{ text-align:left; color:var(--ink-dim); font-size:12px; padding-right:8px; white-space:nowrap; }
  .dot{ width:16px; height:16px; border-radius:50%; margin:0 auto; border:1.5px solid var(--border); }
  .dot.on{ background:var(--sage); border-color:var(--sage); }
  .dot.today{ box-shadow: 0 0 0 2px var(--amber); }

  .streaks{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .streak-pill{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; flex:1; min-width:120px; text-align:center; }
  .streak-num{ font-family:'Fraunces',serif; font-size:22px; color:var(--amber); }
  .streak-lbl{ font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }

  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:11px; color:var(--ink-dim); }
  .field input{
    background:var(--surface-2); border:1px solid var(--border); color:var(--ink); border-radius:8px;
    padding:10px; font-size:14px; font-family:'IBM Plex Mono',monospace;
  }
  .field input:focus{ outline:none; border-color:var(--amber); }
  .btn-primary{
    background:var(--amber); color:#1A1508; border:none; border-radius:10px; padding:13px; font-weight:700;
    font-size:14px; width:100%; margin-top:14px; cursor:pointer;
  }
  .btn-secondary{
    background:none; color:var(--amber); border:1px solid var(--amber-dim); border-radius:10px; padding:12px;
    font-size:14px; width:100%; margin-top:10px; cursor:pointer; font-weight:600;
  }
  .save-msg{ text-align:center; font-size:12px; color:var(--sage); margin-top:8px; min-height:16px; }
  .history-item{ display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid var(--border); font-size:13px; }
  .history-item:first-child{ border-top:none; }
  .history-date{ color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; font-size:11.5px; }

  .q-row{ display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--border); }
  .q-row:first-child{ border-top:none; }
  .q-text{ flex:1; font-size:13px; }
  .q-text.done{ color:var(--ink-faint); text-decoration:line-through; }
  .q-del{ color:var(--ink-faint); background:none; border:none; cursor:pointer; font-size:16px; padding:2px 6px; }
  .q-add-row{ display:flex; gap:8px; margin-top:10px; }
  .q-add-row input{
    flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--ink); border-radius:8px;
    padding:10px; font-size:13px;
  }
  .q-add-btn{ background:var(--amber); color:#1A1508; border:none; border-radius:8px; padding:0 16px; font-weight:700; cursor:pointer; }

  .cal-nav{ display:flex; align-items:center; justify-content:space-between; padding:4px 4px 14px; }
  .cal-nav-btn{ width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; }
  .cal-nav-btn.disabled{ opacity:0.3; pointer-events:none; }
  .cal-month-label{ font-family:'Fraunces',serif; font-size:17px; text-transform:capitalize; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:12px; margin-bottom:8px; }
  .cal-dow{ text-align:center; font-size:10px; color:var(--ink-faint); text-transform:uppercase; padding-bottom:4px; }
  .cal-day{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer;
    font-size:12px; color:var(--ink-dim); border:1.5px solid transparent; position:relative; }
  .cal-day:hover{ background:var(--surface-2); }
  .cal-day.cal-partial{ border-color:var(--amber-dim); color:var(--ink); }
  .cal-day.cal-full{ background:var(--sage-dim); border-color:var(--sage); color:var(--ink); }
  .cal-day.cal-today{ box-shadow: 0 0 0 2px var(--amber); font-weight:700; color:var(--ink); }
  #cal-detail{ margin-top:6px; }

  .comment-btn{ background:none; border:1px solid var(--border); color:var(--ink-faint); width:22px; height:22px; border-radius:50%;
    font-size:14px; line-height:1; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; padding:0; }
  .comment-btn.has{ color:var(--amber); border-color:var(--amber-dim); }
  .task-comment-box{ display:none; margin:6px 0 0 36px; }
  .task-comment-box.open{ display:block; }
  .task-comment-box textarea{ width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--ink);
    border-radius:8px; padding:8px; font-size:12.5px; font-family:'Inter',sans-serif; resize:vertical; box-sizing:border-box; }
  .photo-row{ display:flex; align-items:center; gap:10px; margin-top:6px; }
  .photo-btn{ background:var(--surface-2); border:1px solid var(--border); color:var(--ink-dim); border-radius:8px;
    padding:7px 12px; font-size:12px; cursor:pointer; }
  .photo-preview{ max-width:60px; max-height:60px; border-radius:6px; border:1px solid var(--border); object-fit:cover; }
  .photo-remove{ background:none; border:none; color:var(--coral); font-size:12px; cursor:pointer; text-decoration:underline; }
  .comment-save-btn{ background:var(--amber); color:#1A1508; border:none; border-radius:8px; padding:6px 14px;
    font-size:12px; font-weight:700; cursor:pointer; margin-top:8px; }
  .comment-saved-msg{ font-size:11px; color:var(--sage); margin-left:8px; }
  .link-btn{ background:none; border:none; color:var(--ink-faint); font-size:11.5px; cursor:pointer; padding:0; text-decoration:underline; }

  .pct-ring{ width:22px; height:22px; border-radius:50%; margin:0 auto; display:flex; align-items:center; justify-content:center; }
  .pct-ring.today{ box-shadow:0 0 0 2px var(--amber); }
  .pct-ring-inner{ width:15px; height:15px; border-radius:50%; background:var(--surface); }

  .loading{ text-align:center; padding:40px; color:var(--ink-faint); font-size:13px; }

  html, body{ overscroll-behavior-y: contain; }

  .report-panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:16px; }
  .report-scope-row{ display:flex; gap:8px; margin-bottom:12px; }
  .scope-btn{ flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--ink-dim);
    border-radius:10px; padding:9px 0; font-size:13px; font-weight:600; cursor:pointer; }
  .scope-btn.active{ background:var(--amber); color:#1A1508; border-color:var(--amber); }
  .rep-check{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-dim); padding:5px 0; cursor:pointer; }
  .rep-check input{ width:16px; height:16px; accent-color:var(--amber); }

  .water-bucket-wrap{ text-align:center; height:0; overflow:visible; }
  .water-bucket{ display:none; font-size:36px; position:relative; margin:0 auto 8px; width:44px; }
  .water-bucket.show{ display:block; animation: bucketPop .45s ease; }
  .water-bucket .wb-check{ position:absolute; top:-6px; right:-8px; background:var(--sage); color:#0C0F14;
    border-radius:50%; width:20px; height:20px; font-size:13px; font-weight:900; display:flex; align-items:center; justify-content:center; }
  @keyframes bucketPop{ 0%{ transform:scale(0); opacity:0; } 55%{ transform:scale(1.3); opacity:1; } 100%{ transform:scale(1); } }
</style>
</head>

const GCAL_CLIENT_ID = "597690610927-qo47jp937va97bjbislrsi16vf67d8au.apps.googleusercontent.com";
let gcalTokenClient = null;
let gcalAccessToken = null;
let gcalReady = false;

function initGCal(){
  let attempts = 0;
  const tryInit = () => {
    attempts++;
    const gapiReady = typeof gapi !== 'undefined';
    const gsiReady = typeof google !== 'undefined' && google.accounts && google.accounts.oauth2;
    if(!gapiReady || !gsiReady){
      if(attempts < 40){ setTimeout(tryInit, 250); }
      else { console.warn('GCal libraries did not load in time — Google Calendar connect will be unavailable.'); }
      return;
    }
    try{
      gapi.load('client', async () => {
        try{
          await gapi.client.init({});
          await gapi.client.load('https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest');
          gcalReady = true;
        }catch(e){ console.error('GCal client load error', e); }
      });
      gcalTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GCAL_CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/calendar.readonly',
        callback: (resp) => {
          if(resp.access_token){
            gcalAccessToken = resp.access_token;
            gapi.client.setToken({ access_token: gcalAccessToken });
            document.getElementById('gcal-btn').textContent = '📅 Conectado ✓';
            document.getElementById('gcal-btn').classList.add('active');
            refreshGCalViews();
          }
        },
      });
    }catch(e){ console.error('GCal init error', e); }
  };
  tryInit();
}
window.addEventListener('load', () => { setTimeout(initGCal, 500); });

function connectGoogleCalendar(){
  if(!gcalTokenClient){ alert('Google ainda carregando, tenta de novo em alguns segundos.'); return; }
  gcalTokenClient.requestAccessToken();
}

async function fetchGCalEvents(dateObj){
  if(!gcalAccessToken || !gcalReady) return null;
  const start = new Date(dateObj); start.setHours(0,0,0,0);
  const end = new Date(dateObj); end.setHours(23,59,59,999);
  try{
    const resp = await gapi.client.calendar.events.list({
      calendarId: 'primary',
      timeMin: start.toISOString(),
      timeMax: end.toISOString(),
      singleEvents: true,
      orderBy: 'startTime',
    });
    return resp.result.items || [];
  }catch(e){
    console.error('GCal fetch error', e);
    return null;
  }
}

function renderGCalBox(events){
  if(events === null) return '';
  if(events.length === 0) return `<div class="info-card" style="margin-bottom:12px;">📅 Sem eventos no Google Calendar hoje.</div>`;
  const rows = events.map(ev => {
    const time = ev.start.dateTime ? new Date(ev.start.dateTime).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : 'dia todo';
    return `<div style="display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--border);font-size:13px;"><span class="mono" style="color:var(--amber);min-width:52px;">${time}</span><span>${ev.summary || '(sem título)'}</span></div>`;
  }).join('');
  return `<div class="info-card" style="margin-bottom:12px;padding-top:8px;"><b>📅 Google Calendar</b>${rows}</div>`;
}

async function refreshGCalViews(){
  if(document.getElementById('view-hoje').classList.contains('active')){
    const events = await fetchGCalEvents(today);
    const el = document.getElementById('gcal-hoje');
    if(el) el.innerHTML = renderGCalBox(events);
  }
}

const UNLOCK_HOURS = 12;

function unlockApp(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const until = Date.now() + UNLOCK_HOURS * 60 * 60 * 1000;
  try{ localStorage.setItem('gandini-unlocked-until', String(until)); }catch(e){}
  initApp();
}

function logoutApp(){
  if(!confirm('Sair do Gandini 4.0? Você vai precisar da senha ou da digital pra entrar de novo. Seus dados continuam salvos.')) return;
  try{ localStorage.removeItem('gandini-unlocked-until'); }catch(e){}
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('pw').value = '';
  showFingerprintButtonIfAvailable();
}


function requestPasswordUnlock(){
  return new Promise((resolve) => {
    const modal = document.getElementById('pw-modal');
    const input = document.getElementById('pw-modal-input');
    const err = document.getElementById('pw-modal-err');
    const fpBtn = document.getElementById('pw-modal-fp');
    const okBtn = document.getElementById('pw-modal-ok');
    const cancelBtn = document.getElementById('pw-modal-cancel');

    input.value = ''; err.textContent = '';
    fpBtn.style.display = (localStorage.getItem('gandini-fp-cred') && window.PublicKeyCredential) ? 'block' : 'none';
    modal.style.display = 'flex';
    setTimeout(() => input.focus(), 50);

    function cleanup(){
      modal.style.display = 'none';
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      fpBtn.removeEventListener('click', onFp);
      input.removeEventListener('keydown', onKey);
    }
    function onOk(){
      if(input.value === PASSWORD){ cleanup(); resolve(true); }
      else { err.textContent = 'Senha incorreta.'; }
    }
    function onCancel(){ cleanup(); resolve(false); }
    async function onFp(){
      const credB64 = localStorage.getItem('gandini-fp-cred');
      try{
        const challenge = crypto.getRandomValues(new Uint8Array(32));
        await navigator.credentials.get({
          publicKey: { challenge, allowCredentials: [{ id: b64ToBuf(credB64), type: 'public-key' }], userVerification: 'required', timeout: 60000 }
        });
        cleanup(); resolve(true);
      }catch(e){ err.textContent = 'Digital não reconhecida — usa a senha.'; }
    }
    function onKey(e){ if(e.key === 'Enter') onOk(); }
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    fpBtn.addEventListener('click', onFp);
    input.addEventListener('keydown', onKey);
  });
}

function checkPersistedUnlock(){
  try{
    const until = parseInt(localStorage.getItem('gandini-unlocked-until') || '0', 10);
    if(until && Date.now() < until){
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      initApp();
      return true;
    }
  }catch(e){}
  return false;
}

function tryUnlock(){
  const val = document.getElementById('pw').value;
  if(val === PASSWORD){
    unlockApp();
  } else {
    document.getElementById('gate-err').textContent = "Senha incorreta / Wrong password / パスワードが違います";
  }
}
document.getElementById('pw').addEventListener('keydown', e => { if(e.key === 'Enter') tryUnlock(); });

/* -------- Fingerprint (WebAuthn platform authenticator) -------- */
function bufToB64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64ToBuf(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

function showFingerprintButtonIfAvailable(){
  const btn = document.getElementById('gate-fp-btn');
  if(!btn) return;
  const hasCred = !!localStorage.getItem('gandini-fp-cred');
  const supported = !!(window.PublicKeyCredential);
  btn.style.display = (hasCred && supported) ? 'block' : 'none';
}

async function registerFingerprint(){
  if(!window.PublicKeyCredential){ alert('Esse navegador não suporta login por impressão digital.'); return; }
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const userId = crypto.getRandomValues(new Uint8Array(16));
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge,
        rp: { name: 'Gandini 4.0' },
        user: { id: userId, name: 'fabio', displayName: 'Fábio Gandini' },
        pubKeyCredParams: [{ alg: -7, type: 'public-key' }, { alg: -257, type: 'public-key' }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000,
      }
    });
    localStorage.setItem('gandini-fp-cred', bufToB64(cred.rawId));
    showFingerprintButtonIfAvailable();
    alert('Impressão digital cadastrada! Da próxima vez você pode entrar com ela.');
  }catch(e){
    console.error('fingerprint register error', e);
    alert('Não foi possível cadastrar a digital neste aparelho/navegador.');
  }
}

  if(!credB64) return;
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    await navigator.credentials.get({
      publicKey: {
        challenge,
        allowCredentials: [{ id: b64ToBuf(credB64), type: 'public-key' }],
        userVerification: 'required',
        timeout: 60000,
      }
    });
    unlockApp();
  }catch(e){
    console.error('fingerprint auth error', e);
    document.getElementById('gate-err').textContent = 'Digital não reconhecida — usa a senha.';
  }
}

/* ---------------- DATE / DAY TYPE HELPERS ---------------- */
function fmtKey(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getDayType(d){
  const wd = d.getDay();
  if([1,3,5].includes(wd)) return 'treino';
  if([2,4].includes(wd)) return 'descanso';
  if(wd === 6) return 'sabado';
  return 'domingo';
}
function startOfWeek(d){
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const monday = new Date(d);
  monday.setDate(d.getDate() + diff);
  monday.setHours(0,0,0,0);
  return monday;
}

function dayOfYear(d){
  const start = new Date(d.getFullYear(), 0, 0);
  const diff = d - start;
  return Math.floor(diff / 86400000);
}


function buildSections(date, lang){
  const t = T[lang];
  const type = getDayType(date);
  const wd = date.getDay();
  const sections = [];

  const prayer = WEEKLY_PRAYER[wd];
  const bulletText = prayer.bullets[lang].map(b => `• ${b}`).join('  ');
  const prayerNote = `${prayer.title[lang]} — ${prayer.scripture[lang]}. ${bulletText}`;

  if(type === 'treino'){
    sections.push({ id:'wake', time:'5h', title:t.sec.wake, tasks:[{id:'acordar', label:t.task.acordar5}] });
    sections.push({ id:'espiritual', time:'5h05', title:t.sec.espiritual, tasks:[
      {id:'oracao', label:t.task.oracaoTreino, note: prayerNote},
      {id:'meditacao', label:t.task.meditacao},
    ]});
    const letra = TREINO_LETRA[wd];
    const exList = WORKOUTS[letra].map(ex => ({
      id: `tr_${ex.id}`,
      label: exLabel(ex, lang),
      note: exNote(ex, lang),
    }));
    sections.push({ id:'treino', time:'5h25', title:`${t.sec.treino} ${letra}`, tasks: exList,
      groupIds: exList.map(e => e.id) });
  } else if(type === 'descanso'){
    sections.push({ id:'wake', time:'6h', title:t.sec.wake, tasks:[{id:'acordar', label:t.task.acordar6}] });
    sections.push({ id:'espiritual', time:'6h05', title:t.sec.espiritual, tasks:[
      {id:'oracao', label:t.task.oracaoSimples, note: prayerNote},
    ]});
    if(wd === 2){
      sections.push({ id:'pesagem', time:'', title:t.sec.pesagem, tasks:[
        {id:'pesagem', label:t.task.pesagem},
      ]});
    }
  } else if(type === 'sabado'){
    sections.push({ id:'wake', time:'6h', title:t.sec.wake, tasks:[{id:'acordar', label:t.task.acordar6}] });
    sections.push({ id:'espiritual', time:'', title:t.sec.espiritual, tasks:[
      {id:'oracao', label:t.task.oracaoSimples, note: prayerNote},
    ]});
    sections.push({ id:'jacob', time:'', title:t.sec.jacob, tasks:[
      {id:'jacob', label:t.task.jacob},
    ]});
  } else if(type === 'domingo'){
    sections.push({ id:'espiritual', time:'', title:t.sec.espiritual, tasks:[
      {id:'oracao', label:t.task.oracaoSimples, note: prayerNote},
      {id:'igreja', label:t.task.igreja},
    ]});
  }

  if(wd === 4 || wd === 5){
    sections.push({ id:'estudo', time:'13h', title:t.sec.estudo, tasks:[
      {id:'revego', label:t.task.revego},
    ], note: wd === 5 ? t.task.revegoNote : null });
  }

  const refeicaoTasks = [
    {id:'cafe', label:t.task.cafe, note:t.task.graca},
    {id:'lancheManha', label:t.task.lancheManha},
    {id:'almoco', label:t.task.almoco},
  ];
  if(wd !== 0 && wd !== 6){
    refeicaoTasks.push({id:'catalogue', label:t.task.catalogue});
  }
  refeicaoTasks.push(
    {id:'lancheTarde', label:t.task.lancheTarde},
    {id:'jantar', label:t.task.jantar, note:t.task.graca},
    {id:'ceia', label:t.task.ceia},
  );
  sections.push({ id:'refeicoes', time:'', title:t.sec.refeicoes, tasks:refeicaoTasks });

  const doy = dayOfYear(date);
  const devoKey = `${date.getMonth()+1}-${date.getDate()}`;
  const devoPage = DEVOTIONAL_PAGES[devoKey];
  const devoText = lang === 'pt' ? `Devocional do dia — dia ${doy} de "One Year Devotions for Men"`
    : lang === 'en' ? `Daily devotional — day ${doy} of "One Year Devotions for Men"`
    : `今日のデボーション — 『One Year Devotions for Men』${doy}日目`;
  const devoLabel = devoPage
    ? `<a href="One_Year_Devotions_for_Men.pdf#page=${devoPage}" target="_blank" style="color:inherit;text-decoration:underline;text-decoration-color:var(--amber);">${devoText}</a>`
    : devoText;
  sections.push({ id:'oracaoAlmoco', time:'12h', title:t.sec.oracaoAlmoco, tasks:[
    { id:'devocionalAlmoco', label: devoLabel },
  ]});

  sections.push({ id:'agua', time:'', title:t.sec.agua, tasks:[], isWater:true });

  const suplList = getSuplementosList();
  sections.push({ id:'suplementos', time:'', title:t.sec.suplementos, isSuplementos:true, tasks:
    suplList.filter(s => s.ativo).map(s => ({ id:s.id, label:s.nome }))
  });

  sections.push({ id:'medicamentos', time:'', title:t.sec.medicamentos, tasks:[
    {id:'fluoxetine', label:t.task.fluoxetine},
    {id:'anfetamina', label:t.task.anfetamina},
  ]});

  if([1,3,5].includes(wd)){
    const rotina = { 1:t.task.chiExcel, 3:t.task.chiLeitura, 5:t.task.chiLivre };
    sections.push({ id:'tempoChi', time:'', title:t.sec.tempoChi, tasks:[
      {id:'tempoChi', label: rotina[wd]},
    ]});
  }

  const dormirLabel = wd === 5 ? t.task.dormirFlex : (type === 'treino' ? t.task.dormir23 : t.task.dormirSimples);
  sections.push({ id:'winddown', time:'', title:t.sec.winddown, tasks:[
    {id:'winddown', label:t.task.winddown},
    {id:'dormir', label: dormirLabel},
  ]});

  return sections;
}

  return seed;
}
function saveSuplementosList(list){
  try{ localStorage.setItem('gandini-suplementos-list', JSON.stringify(list)); }catch(e){}
}
function addSuplemento(nome){
  if(!nome || !nome.trim()) return;
  const list = getSuplementosList();
  list.push({ id: 'sup_' + Date.now(), nome: nome.trim(), ativo: true });
  saveSuplementosList(list);
  renderHoje();
}
function pauseSuplemento(id){
  const list = getSuplementosList();
  const item = list.find(s => s.id === id);
  if(item){ item.ativo = !item.ativo; saveSuplementosList(list); renderHoje(); }
}
function deleteSuplemento(id){
  if(!confirm('Remover esse suplemento da lista? (o histórico de dias anteriores não é apagado)')) return;
  let list = getSuplementosList();
  list = list.filter(s => s.id !== id);
  saveSuplementosList(list);
  renderHoje();
}

function suplementosFrac(dt){
  const active = getSuplementosList().filter(s => s.ativo);
  if(active.length === 0) return 1;
  const done = active.filter(s => !!dt[s.id]).length;
  return done / active.length;
}

function compressImage(file, maxWidth, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function cleanupOldPhotos(){
  try{
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 45);
    const cutoffKey = fmtKey(cutoff);
    Object.keys(localStorage).filter(k => k.startsWith('gandini-day:')).forEach(k => {
      const dateStr = k.replace('gandini-day:', '');
      if(dateStr < cutoffKey){
        try{
          const rec = JSON.parse(localStorage.getItem(k));
          let changed = false;
          Object.keys(rec).forEach(field => {
            if(field.startsWith('p_')){ delete rec[field]; changed = true; }
          });
          if(changed) localStorage.setItem(k, JSON.stringify(rec));
        }catch(e){}
      }
    });
  }catch(e){ console.error('cleanup error', e); }
}

async function getWeekTreinoStatus(date){
  const monday = startOfWeek(date);
  const defs = [ {offset:0, letra:'A'}, {offset:2, letra:'B'}, {offset:4, letra:'C'} ];

  const weekDates = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    if(d <= date) weekDates.push(d);
  }
  const weekRecords = await Promise.all(weekDates.map(d => getDay(fmtKey(d))));

  const result = [];
  for(const def of defs){
    const dt = new Date(monday); dt.setDate(monday.getDate()+def.offset);
    const key = fmtKey(dt);
    const rec = await getDay(key);
    let done = !!rec.treino;
    if(!done){
      done = weekRecords.some(wr => !!wr[`makeup_${def.letra}`]);
    }
    result.push({key, letra:def.letra, done, dateObj: dt});
  }
  return result;
}

function attachCommentBox(container, dataObj, dataKey, taskId, isMeal, commentBtn, onSaved){
  const t = T[currentLang];
  const commentKey = `c_${taskId}`;
  const photoKey = `p_${taskId}`;
  const box = document.createElement('div');
  box.className = 'task-comment-box';
  let boxHtml = `<textarea rows="2" placeholder="${t.commentPlaceholder}">${dataObj[commentKey] || ''}</textarea>`;
  if(isMeal){
    boxHtml += `
      <div class="photo-row">
        <input type="file" accept="image/*" capture="environment" class="photo-input" style="display:none">
        <button class="photo-btn" type="button">📷 ${t.photoBtn}</button>
        <img class="photo-preview" style="${dataObj[photoKey] ? '' : 'display:none;'}" src="${dataObj[photoKey] || ''}">
        <button class="photo-remove" type="button" style="${dataObj[photoKey] ? '' : 'display:none;'}">${t.removePhoto}</button>
      </div>`;
  }
  boxHtml += `<button class="comment-save-btn" type="button">${t.btnSave}</button><span class="comment-saved-msg"></span>`;
  box.innerHTML = boxHtml;
  container.appendChild(box);

  let pendingPhoto = dataObj[photoKey] || null;
  let photoRemoved = false;

  if(isMeal){
    const fileInput = box.querySelector('.photo-input');
    const photoBtn = box.querySelector('.photo-btn');
    const preview = box.querySelector('.photo-preview');
    const removeBtn = box.querySelector('.photo-remove');
    photoBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if(!file) return;
      try{
        const dataUrl = await compressImage(file, 500, 0.55);
        pendingPhoto = dataUrl;
        photoRemoved = false;
        preview.src = dataUrl;
        preview.style.display = '';
        removeBtn.style.display = '';
      }catch(e){ console.error('photo compress error', e); }
    });
    removeBtn.addEventListener('click', () => {
      pendingPhoto = null;
      photoRemoved = true;
      preview.style.display = 'none';
      removeBtn.style.display = 'none';
      fileInput.value = '';
    });
  }

  const saveBtn = box.querySelector('.comment-save-btn');
  const savedMsg = box.querySelector('.comment-saved-msg');
  const textarea = box.querySelector('textarea');
  saveBtn.addEventListener('click', async () => {
    dataObj[commentKey] = textarea.value;
    if(isMeal){
      if(photoRemoved){ delete dataObj[photoKey]; }
      else if(pendingPhoto){ dataObj[photoKey] = pendingPhoto; }
    }
    await setDay(dataKey, dataObj);
    const hasContent = (textarea.value.trim().length > 0) || (isMeal && !!dataObj[photoKey]);
    if(commentBtn) commentBtn.classList.toggle('has', hasContent);
    savedMsg.textContent = t.savedMsg;
    setTimeout(() => { savedMsg.textContent = ''; }, 1500);
    if(onSaved) onSaved();
  });

  return box;
}

function adjustWater(delta){
  let ml = (dayData.agua_ml || 0) + delta;
  if(ml < 0) ml = 0;
  const goal = 3500;
  const wasFull = (dayData.agua_ml || 0) >= goal;
  dayData.agua_ml = ml;
  setDay(todayKey, dayData);
  document.getElementById('water-bar-in').style.width = Math.min(100, (ml/goal*100)) + '%';
  document.getElementById('water-txt').textContent = `${ml} / ${goal} ml`;
  const bucket = document.getElementById('water-bucket');
  if(bucket){
    const isFull = ml >= goal;
    if(isFull && !wasFull){ bucket.classList.remove('show'); void bucket.offsetWidth; bucket.classList.add('show'); }
    else if(!isFull){ bucket.classList.remove('show'); }
  }
  updateArc();
  renderSemanaIfActive();
}


function updateArc(){
  const sections = buildSections(today, currentLang);
  let total = 0, done = 0;
  sections.forEach(sec => {
    if(sec.isWater){
      total += 1;
      if((dayData.agua_ml||0) >= 3500) done += 1;
    } else {
      sec.tasks.forEach(tk => { total += 1; if(getChecked(tk.id)) done += 1; });
    }
  });
  const pct = total ? Math.round((done/total)*100) : 0;
  const circumference = 235.6;
  const offset = circumference - (circumference * pct / 100);
  document.getElementById('arc-fill').style.strokeDashoffset = offset;
  document.getElementById('arc-pct-txt').textContent = pct + '%';
}

async function renderCalendarGrid(){
  document.getElementById('cal-month-label').textContent = `${MESES[currentLang][calMonth.getMonth()]} ${calMonth.getFullYear()}`;
  const nextMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1);
  document.getElementById('cal-next-btn').classList.toggle('disabled', nextMonth > CAL_MAX);

  const daysInMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 0).getDate();
  const firstDay = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
  let startOffset = firstDay.getDay();
  startOffset = startOffset === 0 ? 6 : startOffset - 1;

  const dateObjs = [];
  for(let d=1; d<=daysInMonth; d++) dateObjs.push(new Date(calMonth.getFullYear(), calMonth.getMonth(), d));
  const dataList = await Promise.all(dateObjs.map(d => getDay(fmtKey(d))));

  const dowShort = { pt:['S','T','Q','Q','S','S','D'], en:['M','T','W','T','F','S','S'], ja:['月','火','水','木','金','土','日'] }[currentLang];

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  dowShort.forEach(l => {
    const h = document.createElement('div'); h.className='cal-dow'; h.textContent = l; grid.appendChild(h);
  });
  for(let i=0;i<startOffset;i++){ grid.appendChild(document.createElement('div')); }

  dateObjs.forEach((d, idx) => {
    const dt = dataList[idx];
    const sections = buildSections(d, currentLang);
    let total = 0, done = 0;
    sections.forEach(sec => {
      if(sec.isWater){ total += 1; if((dt.agua_ml||0) >= 3500) done += 1; }
      else sec.tasks.forEach(tk => { total += 1; if(dt[tk.id]) done += 1; });
    });
    const pct = total ? done/total : 0;
    const cell = document.createElement('div');
    cell.className = 'cal-day';
    if(fmtKey(d) === todayKey) cell.classList.add('cal-today');
    if(pct >= 0.99) cell.classList.add('cal-full');
    else if(pct > 0) cell.classList.add('cal-partial');
    cell.innerHTML = `<span>${d.getDate()}</span>`;
    cell.addEventListener('click', () => renderDayDetail(d));
    grid.appendChild(cell);
  });
}

            <div class="water-btn" data-act="minus">−</div>
            <div class="water-fill">
              <div class="water-bar"><div class="water-bar-in" style="width:${Math.min(100,(ml/goal*100))}%"></div></div>
              <div class="water-txt">${ml} / ${goal} ml</div>
            </div>
            <div class="water-btn" data-act="plus">+</div>
          </div>
          <button class="comment-btn ${hasComment ? 'has' : ''}" type="button">+</button>
        </div>`;
      const adjust = async (delta) => {
        data.agua_ml = Math.max(0, (data.agua_ml||0) + delta);
        await setDay(key, data);
        if(key === todayKey){ dayData = data; updateArc(); renderSemanaIfActive(); }
        renderDayDetail(dateObj);
        renderCalendarGrid();
      };
      wrap.querySelector('[data-act="plus"]').addEventListener('click', () => adjust(250));
      wrap.querySelector('[data-act="minus"]').addEventListener('click', () => adjust(-250));
      const commentBtn = wrap.querySelector('.comment-btn');
      const commentBox = attachCommentBox(wrap, data, key, 'agua', false, commentBtn, () => {
        if(key === todayKey) dayData = data;
      });
      commentBtn.addEventListener('click', () => { commentBox.classList.toggle('open'); });
      body.appendChild(wrap);
    } else if(sec.id === 'medicamentos' && !medUnlocked){
      const lockBtn = document.createElement('button');
      lockBtn.className = 'btn-secondary';
      lockBtn.style.width = '100%';
      lockBtn.textContent = '🔒 Toque pra ver (confidencial)';
      lockBtn.addEventListener('click', async () => {
        const ok = await requestPasswordUnlock();
        if(ok){ medUnlocked = true; renderDayDetail(dateObj); }
      });
      body.appendChild(lockBtn);
    } else {
      sec.tasks.forEach(tk => {
        const row = document.createElement('div');
        const done = !!data[tk.id];
        const isMeal = MEAL_TASK_IDS.includes(tk.id);
        const commentKey = `c_${tk.id}`;
        const photoKey = `p_${tk.id}`;
        const hasComment = !!((data[commentKey] && data[commentKey].trim()) || (isMeal && data[photoKey]));
        row.className = 'task-row' + (done ? ' done' : '');
        let html = `<div class="task-row-main">
          <div class="check ${done ? 'done' : ''}">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0C0F14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="task-label">${tk.label}</div>
          <button class="comment-btn ${hasComment ? 'has' : ''}" type="button">+</button>
        </div>`;
        if(tk.note) html += `<div class="task-note-inline">${tk.note}</div>`;
        row.innerHTML = html;
        row.querySelector('.check').addEventListener('click', async () => {
          data[tk.id] = !data[tk.id];
          if(sec.groupIds){
            data.treino = sec.groupIds.every(id => !!data[id]);
          }
          await setDay(key, data);
          if(key === todayKey){ dayData = data; updateArc(); renderSemanaIfActive(); }
          renderDayDetail(dateObj);
          renderCalendarGrid();
        });
        const cBtn = row.querySelector('.comment-btn');
        const cBox = attachCommentBox(row, data, key, tk.id, isMeal, cBtn, () => {
          if(key === todayKey) dayData = data;
        });
        cBtn.addEventListener('click', () => { cBox.classList.toggle('open'); });
        body.appendChild(row);
      });
      if(sec.id === 'medicamentos' && medUnlocked){
        const hideBtn = document.createElement('button');
        hideBtn.className = 'btn-secondary';
        hideBtn.style.cssText = 'width:100%;margin-top:8px;';
        hideBtn.textContent = '🔒 Esconder de novo';
        hideBtn.addEventListener('click', () => { medUnlocked = false; renderDayDetail(dateObj); });
        body.appendChild(hideBtn);
      }
    }
    if(sec.note){
      const n = document.createElement('div');
      n.className = 'task-note-inline'; n.style.padding = '4px 0 8px 4px';
      n.textContent = sec.note;
      body.appendChild(n);
    }
    box.appendChild(body);
    container.appendChild(box);
  });
}

async function renderSemana(){
  const t = T[currentLang];
  const container = document.getElementById('semana-content');
  container.innerHTML = '<div class="loading">…</div>';

  const monday = startOfWeek(today);
  const weekDates = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    weekDates.push(d);
  }
  const weekData = await Promise.all(weekDates.map(d => getDay(fmtKey(d))));

  const streakCats = [
    {key:'oracao', label:t.streak.oracao},
    {key:'treino', label:t.streak.treino},
    {key:'suplementosOk', label:t.streak.suplementos},
  ];
  const streaks = {};
  for(const cat of streakCats){
    let count = 0;
    for(let i=0;i<60;i++){
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      if(d < LAUNCH_DATE) break;
      const dt = i===0 ? dayData : await getDay(fmtKey(d));
      const type = getDayType(d);
      let ok;
      if(cat.key === 'treino'){
        if(type !== 'treino') continue;
        ok = !!dt['treino'];
      } else if(cat.key === 'suplementosOk'){
        ok = suplementosFrac(dt) === 1;
      } else {
        ok = !!dt[cat.key];
      }
      if(ok) count++;
      else break;
    }
    streaks[cat.key] = count;
  }

  let html = '<div class="streaks">';
  streakCats.forEach(c => {
    html += `<div class="streak-pill"><div class="streak-num">🔥 ${streaks[c.key]}</div><div class="streak-lbl">${c.label}</div></div>`;
  });
  html += '</div>';

  const HABIT_ROWS = [
    { key:'oracao', label:t.streak.oracao },
    { key:'treino', label:t.streak.treino },
    { key:'aguaOk', label:t.water.label.split(' —')[0] },
    { key:'suplementosOk', label:t.streak.suplementos },
    { key:'medicamentos', label:t.sec.medicamentos },
    { key:'tempoChi', label:t.sec.tempoChi },
  ];

  function treinoFrac(dt, d){
    const letra = TREINO_LETRA[d.getDay()];
    const exs = WORKOUTS[letra] || [];
    if(exs.length === 0) return 0;
    const done = exs.filter(ex => !!dt[`tr_${ex.id}`]).length;
    return done / exs.length;
  }
  function ringColor(pct){
    if(pct >= 90) return '#5AA9E6';
    if(pct >= 50) return 'var(--sage)';
    if(pct > 0) return 'var(--amber)';
    return 'var(--border)';
  }
  function ringHTML(pct, isToday){
    const color = ringColor(pct);
    return `<div class="pct-ring ${isToday ? 'today' : ''}" style="background:conic-gradient(${color} ${pct*3.6}deg, var(--border) 0deg);"><div class="pct-ring-inner"></div></div>`;
  }

  html += '<div class="week-grid"><table class="wk"><thead><tr><th style="text-align:left;">&nbsp;</th>';
  weekDates.forEach(d => {
    html += `<th>${DIAS[currentLang][d.getDay()].slice(0,3)}<br><span class="mono" style="font-size:10px;color:var(--ink-faint)">${d.getDate()}</span></th>`;
  });
  html += '</tr></thead><tbody>';

  HABIT_ROWS.forEach(row => {
    const labelHtml = row.key === 'medicamentos' && !medUnlocked
      ? `<span class="link-btn" id="semana-med-unlock" style="font-size:12.5px;">🔒 ${row.label}</span>`
      : row.label;
    html += `<tr><td class="label">${labelHtml}</td>`;
    weekDates.forEach((d, idx) => {
      const dt = weekData[idx];
      const type = getDayType(d);
      let pct = 0, applicable = true;
      if(row.key === 'treino'){ applicable = type === 'treino'; pct = applicable ? treinoFrac(dt, d) * 100 : 0; }
      else if(row.key === 'aguaOk'){ pct = Math.min(100, ((dt.agua_ml||0) / 3500) * 100); }
      else if(row.key === 'suplementosOk'){ pct = suplementosFrac(dt) * 100; }
      else if(row.key === 'medicamentos'){ pct = ((dt.fluoxetine?1:0) + (dt.anfetamina?1:0)) / 2 * 100; }
      else if(row.key === 'tempoChi'){ applicable = [1,3,5].includes(d.getDay()); pct = dt.tempoChi ? 100 : 0; }
      else { pct = dt[row.key] ? 100 : 0; }

      const isToday = fmtKey(d) === todayKey;
      if(!applicable){
        html += `<td><span style="color:var(--ink-faint);font-size:11px;">–</span></td>`;
      } else if(row.key === 'medicamentos' && !medUnlocked){
        html += `<td><span style="color:var(--ink-faint);font-size:14px;">🔒</span></td>`;
      } else {
        html += `<td>${ringHTML(pct, isToday)}</td>`;
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  container.innerHTML = html;
  const medUnlockLink = document.getElementById('semana-med-unlock');
  if(medUnlockLink){
    medUnlockLink.addEventListener('click', async () => {
      const ok = await requestPasswordUnlock();
      if(ok){ medUnlocked = true; renderSemana(); }
    });
  }
}

function exportBackup(){
  try{
    const data = {};
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('gandini-')) data[k] = localStorage.getItem(k);
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `gandini-backup-${todayKey}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);

  }catch(e){ console.error('backup export error', e); alert('Erro ao exportar backup.'); }
}

function renderBackupStatus(){
  const el = document.getElementById('backup-status');
  if(!el) return;
  const t = T[currentLang];
  const last = localStorage.getItem('gandini-last-backup');
  if(!last){
    el.textContent = t.backupNever;
    el.style.color = 'var(--coral)';
    return;
  }
  const lastDate = new Date(last + 'T00:00:00');
  const diffDays = Math.floor((today - lastDate) / (1000*60*60*24));
  if(diffDays <= 0){
    el.textContent = t.backupToday;
    el.style.color = 'var(--sage)';
  } else if(diffDays <= 7){
    el.textContent = `${t.backupDaysAgo} ${diffDays} ${diffDays === 1 ? t.backupDay : t.backupDays}`;
    el.style.color = 'var(--ink-dim)';
  } else {
    el.textContent = `${t.backupOverdue} ${diffDays} ${diffDays === 1 ? t.backupDay : t.backupDays}`;
    el.style.color = 'var(--coral)';
  }
}

async function gerarRelatorio(){
  try{
    const incl = {
      refeicoes: document.getElementById('rep-refeicoes').checked,
      espiritual: document.getElementById('rep-espiritual').checked,
      treino: document.getElementById('rep-treino').checked,
      agua: document.getElementById('rep-agua').checked,
      medidas: document.getElementById('rep-medidas').checked,
      suplementos: document.getElementById('rep-suplementos').checked,
      medicamentos: document.getElementById('rep-medicamentos').checked && medUnlocked,
    };

    let dates = [];
    let titlePeriod = '';
    if(reportScope === 'dia'){
      dates = [calSelectedDate];
      titlePeriod = `${String(calSelectedDate.getDate()).padStart(2,'0')}/${String(calSelectedDate.getMonth()+1).padStart(2,'0')}/${calSelectedDate.getFullYear()}`;
    } else if(reportScope === 'semana'){
      const monday = startOfWeek(calSelectedDate);
      for(let i=0;i<7;i++){ const d = new Date(monday); d.setDate(monday.getDate()+i); dates.push(d); }
      titlePeriod = `Semana de ${monday.getDate()}/${monday.getMonth()+1}`;
    } else {
      const daysInMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 0).getDate();
      for(let d=1; d<=daysInMonth; d++){ dates.push(new Date(calMonth.getFullYear(), calMonth.getMonth(), d)); }
      titlePeriod = `${MESES.pt[calMonth.getMonth()]} de ${calMonth.getFullYear()}`;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pageH = doc.internal.pageSize.height;
    let y = 20;
    function ensureSpace(n){ if(y+n > pageH-15){ doc.addPage(); y=20; } }

    doc.setFont('helvetica','bold'); doc.setFontSize(15);
    doc.text(`Gandini 4.0 — Relatório (${titlePeriod})`, 20, y); y += 10;

    for(const dt of dates){
      const rec = await getDay(fmtKey(dt));
      const type = getDayType(dt);
      ensureSpace(9);
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(0,0,0);
      doc.text(`${DIAS.pt[dt.getDay()]} ${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}`, 20, y);
      y += 6;
      doc.setFont('helvetica','normal'); doc.setFontSize(9);

      if(incl.espiritual){
        ensureSpace(6);
        doc.text(`Oração: ${rec.oracao ? '[X]' : '[ ]'}`, 24, y); y += 5;
        if(rec.c_oracao){ ensureSpace(6); doc.setFont('helvetica','italic'); doc.text(`"${rec.c_oracao}"`, 28, y); doc.setFont('helvetica','normal'); y += 5; }
      }
      if(incl.treino && type === 'treino'){
        ensureSpace(6);
        doc.text(`Treino: ${rec.treino ? '[X]' : '[ ]'}`, 24, y); y += 5;
      }
      if(incl.agua){
        ensureSpace(6);
        doc.text(`Água: ${rec.agua_ml||0} / 3500ml`, 24, y); y += 5;
        if(rec.c_agua){ ensureSpace(6); doc.setFont('helvetica','italic'); doc.text(`"${rec.c_agua}"`, 28, y); doc.setFont('helvetica','normal'); y += 5; }
      }
      if(incl.suplementos){
        ensureSpace(6);
        const suplList = getSuplementosList().filter(s => s.ativo);
        const suplTxt = suplList.length
          ? suplList.map(s => `${s.nome}:${rec[s.id] ? 'X' : '-'}`).join('  ')
          : '(nenhum suplemento ativo)';
        doc.text(`Suplementos — ${suplTxt}`, 24, y);
        y += 5;
      }
      if(incl.medicamentos){
        ensureSpace(6);
        doc.text(`Medicamentos — Fluoxetine:${rec.fluoxetine?'X':'-'} Anfetamina:${rec.anfetamina?'X':'-'}`, 24, y);
        y += 5;
      }
      if(incl.refeicoes){
        ensureSpace(6);
        doc.setFont('helvetica','bold'); doc.text('Refeições:', 24, y); y += 5.5; doc.setFont('helvetica','normal');
        for(const mealId of MEAL_TASK_IDS){
          const label = MEAL_LABELS[mealId].pt;
          const done = rec[mealId];
          const comment = rec[`c_${mealId}`];
          const photo = rec[`p_${mealId}`];
          ensureSpace(photo ? 32 : 6);
          doc.text(`${done ? '[X]' : '[ ]'} ${label}${comment ? ' — ' + comment : ''}`, 26, y);
          y += 5.5;
          if(photo){
            try{ doc.addImage(photo, 'JPEG', 26, y, 30, 30); y += 33; }
            catch(e){ console.error('photo embed error', e); }
          }
        }
      }
      y += 4;
    }

    if(incl.medidas){
      ensureSpace(10);
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text('Medidas registradas no período:', 20, y); y += 7;
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      const allMedidas = await getAllHistorico();
      const dateKeys = new Set(dates.map(d => fmtKey(d)));
      const inRange = allMedidas.filter(e => dateKeys.has(e.data));
      if(inRange.length === 0){ ensureSpace(6); doc.text('Nenhuma medição registrada.', 20, y); y += 6; }
      else{
        inRange.forEach(e => {
          ensureSpace(6);
          doc.text(`${e.data} — peso: ${e.peso||'—'}kg, cintura: ${e.cintura||'—'}cm, abdômen: ${e.abdomen||'—'}cm`, 20, y);
          y += 5.5;
        });
      }
    }

    const pageW = doc.internal.pageSize.width;
    const totalPages = doc.internal.getNumberOfPages();
    for(let p = 1; p <= totalPages; p++){
      doc.setPage(p);
      try{ doc.addImage(`data:image/jpeg;base64,${LOGO_BASE64}`, 'JPEG', pageW - 32, 8, 18, 20); }catch(e){}
      doc.setFontSize(8); doc.setTextColor(140,140,140);
      doc.text(`${p} / ${totalPages}`, pageW/2, pageH - 8, { align:'center' });
      doc.setTextColor(0,0,0);
    }

    doc.save(`gandini-relatorio-${reportScope}-${fmtKey(dates[0])}.pdf`);
  }catch(e){ console.error('relatorio error', e); alert('Erro ao gerar relatório.'); }
}

async function getPerguntas(){

async function addPergunta(){
  const input = document.getElementById('q-new');
  const text = input.value.trim();
  if(!text) return;
  const list = await getPerguntas();
  list.unshift({ text, asked:false, id: Date.now() });

  input.value = '';

async function togglePergunta(id){
  const list = await getPerguntas();
  const item = list.find(i => i.id === id);
  if(item) item.asked = !item.asked;
  await setPerguntas(list);
  renderPerguntas();
}
async function delPergunta(id){
  let list = await getPerguntas();
  list = list.filter(i => i.id !== id);
  await setPerguntas(list);
  renderPerguntas();
}
async function renderPerguntas(){

    el.innerHTML = `<div style="color:var(--ink-faint);font-size:13px;">${t.noQuestions}</div>`;

  el.innerHTML = list.map(item => `
    <div class="q-row">
      <div class="check ${item.asked ? 'done' : ''}" onclick="togglePergunta(${item.id})">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0C0F14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="q-text ${item.asked ? 'done' : ''}">${item.text}</div>
      <button class="q-del" onclick="delPergunta(${item.id})">×</button>
    </div>
  `).join('');
}

function gerarPDF(){
  (async () => {
    const t = T.pt; // PDF sempre em português — vai pra nutricionista brasileira
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const data = document.getElementById('m-data').value || todayKey;
    const pageH = doc.internal.pageSize.height;
    let y = 20;

    function ensureSpace(next){ if(y + next > pageH - 15){ doc.addPage(); y = 20; } }
    function heading(text){ ensureSpace(12); doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text(text, 20, y); y += 8; doc.setFont('helvetica','normal'); doc.setFontSize(10); }
    function line(text){ ensureSpace(7); doc.text(text, 20, y); y += 6.5; }

    try{
      doc.addImage(`data:image/jpeg;base64,${LOGO_BASE64}`, 'JPEG', 150, 12, 40, 51);
    }catch(e){ console.error('logo pdf error', e); }

    doc.setFont('helvetica','bold');
    doc.setFontSize(16);
    doc.text(t.pdfHeader, 20, y); y += 8;
    doc.setFontSize(10); doc.setFont('helvetica','normal');
    doc.text(`${t.pdfData}: ${data}`, 20, y); y += 10;

    heading('Medidas');
    const rows = [
      [t.lblPeso, document.getElementById('m-peso').value],
      [t.lblCintura, document.getElementById('m-cintura').value],
      [t.lblAbdomen, document.getElementById('m-abdomen').value],
      [t.lblQuadril, document.getElementById('m-quadril').value],
      [t.lblPescoco, document.getElementById('m-pescoco').value],
      [t.lblBraco, document.getElementById('m-braco').value],
      [t.lblCoxa, document.getElementById('m-coxa').value],
      [t.lblPanturrilha, document.getElementById('m-panturrilha').value],
    ];
    rows.forEach(r => {
      ensureSpace(7);
      doc.setFont('helvetica','bold'); doc.text(r[0] + ':', 20, y);
      doc.setFont('helvetica','normal'); doc.text(r[1] || '—', 90, y);
      y += 7;
    });
    y += 4;

    heading(t.pdfLembrete);
    const lembreteText = getLembreteText();
    const lembreteLines = doc.splitTextToSize(lembreteText, 170);
    lembreteLines.forEach(l => line(l));
    y += 4;

    heading(t.pdfPerguntas);
    const perguntas = await getPerguntas();
    if(perguntas.length === 0){
      line('—');
    } else {
      perguntas.forEach(p => {
        const status = p.asked ? t.pdfAsked : t.pdfPending;
        const lines = doc.splitTextToSize(`• ${p.text} ${status}`, 170);
        lines.forEach(l => line(l));
      });
    }
    y += 4;

    heading(t.pdfHistorico);
    const historico = await getAllHistorico();
    if(historico.length === 0){
      line('—');
    } else {
      historico.forEach(e => {
        line(`${e.data} — peso: ${e.peso||'—'}kg · cintura: ${e.cintura||'—'}cm · abdômen: ${e.abdomen||'—'}cm · quadril: ${e.quadril||'—'}cm`);
      });
    }

    ensureSpace(14);
    y += 6;
    doc.setFont('helvetica','italic'); doc.setFontSize(9);
    doc.text(t.pdfFooter, 20, y);

    doc.save(`gandini-medidas-${data}.pdf`);
  })();
}

/* Runs last, after every const/let/function above is fully defined, to avoid referencing them too early. */
initReportPanel();
if(!checkPersistedUnlock()){ showFingerprintButtonIfAvailable(); }
</script>
