<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gandini 4.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>
<style>
  :root{
    --bg: #0C0F14;
    --surface: #151A22;
    --surface-2: #1C222C;
    --border: #262E3A;
    --ink: #EDE9DF;
    --ink-dim: #9AA3B2;
    --ink-faint: #5C6472;
    --amber: #D6A75A;
    --amber-dim: #8A6E3E;
    --sage: #6FA98C;
    --sage-dim: #3A4A42;
    --coral: #C7715C;
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;}
  body{ padding-bottom: 60px; min-height:100vh; }
  ::selection{ background: var(--amber-dim); }

  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; margin:0; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  #gate{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px; padding:24px;
  }
  #gate .mark{ font-family:'Fraunces',serif; font-size:15px; letter-spacing:0.18em; color:var(--amber); text-transform:uppercase; }
  #gate h1{ font-size:32px; color:var(--ink); }
  #gate input{
    background:var(--surface); border:1px solid var(--border); color:var(--ink);
    padding:14px 16px; border-radius:10px; font-size:16px; width:100%; max-width:280px; text-align:center;
    font-family:'IBM Plex Mono',monospace; letter-spacing:0.1em;
  }
  #gate input:focus{ outline:none; border-color:var(--amber); }
  #gate button{
    background:var(--amber); color:#1A1508; border:none; padding:13px 28px; border-radius:10px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:15px; cursor:pointer; width:100%; max-width:280px;
  }
  #gate .err{ color:var(--coral); font-size:13px; height:16px; }
  #app{ display:none; }

  header.top{ padding: 24px 20px 8px; text-align:center; }
  .eyebrow{ font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--amber); margin-bottom:6px; }
  .verse{ font-size:12px; color:var(--ink-faint); font-style:italic; margin-top:4px; }

  .lang-row{ display:flex; justify-content:center; gap:6px; margin: 10px 0 2px; }
  .lang-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:5px 11px; border-radius:20px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink-dim); cursor:pointer;
  }
  .lang-btn.active{ background:var(--amber); color:#1A1508; border-color:var(--amber); font-weight:600; }

  .arc-wrap{ display:flex; justify-content:center; margin: 10px 0 4px; }
  .arc-pct{ font-family:'Fraunces',serif; font-size:30px; }
  .arc-label{ font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.1em; }

  .tabs{ display:flex; gap:8px; padding: 10px 20px 16px; max-width:520px; margin:0 auto; }
  .tab{
    flex:1; text-align:center; padding:10px 0; border-radius:10px; font-size:13px; font-weight:600;
    background:var(--surface); color:var(--ink-dim); cursor:pointer; border:1px solid var(--border);
  }
  .tab.active{ background:var(--amber); color:#1A1508; border-color:var(--amber); }

  main{ max-width:520px; margin:0 auto; padding: 0 16px; }
  .view{ display:none; }
  .view.active{ display:block; }

  .section{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; }
  .section-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; }
  .section-head .st{ display:flex; align-items:center; gap:10px; }
  .section-head .time{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--amber); background:rgba(214,167,90,0.1); padding:3px 8px; border-radius:6px; }
  .section-title{ font-size:15px; font-weight:600; font-family:'Inter',sans-serif; }
  .section-body{ padding: 0 16px 14px; }

  .task-row{ padding:9px 0; border-top:1px solid var(--border); }
  .task-row:first-child{ border-top:none; }
  .task-row-main{ display:flex; align-items:center; gap:12px; }
  .task-note-inline{ font-size:11.5px; color:var(--ink-faint); padding: 4px 0 0 36px; line-height:1.5; font-style:italic; }

  .check{
    width:24px; height:24px; border-radius:7px; border:2px solid var(--ink-faint); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition: all .15s ease;
  }
  .check.done{ background:var(--sage); border-color:var(--sage); }
  .check svg{ width:14px; height:14px; opacity:0; transition: opacity .1s; }
  .check.done svg{ opacity:1; }
  .task-label{ font-size:14px; flex:1; }
  .task-row.done .task-label{ color:var(--ink-dim); text-decoration: line-through; text-decoration-color: var(--ink-faint); }

  .water-box{ display:flex; align-items:center; gap:14px; padding: 4px 0 8px; }
  .water-btn{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2);
    color:var(--ink); font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .water-fill{ flex:1; }
  .water-bar{ height:10px; background:var(--surface-2); border-radius:6px; overflow:hidden; border:1px solid var(--border); }
  .water-bar-in{ height:100%; background: linear-gradient(90deg, var(--amber-dim), var(--amber)); width:0%; transition: width .2s; }
  .water-txt{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-dim); margin-top:6px; }

  .info-card{ background:var(--surface-2); border:1px dashed var(--border); border-radius:10px; padding:12px 14px; font-size:12.5px; color:var(--ink-dim); line-height:1.6; margin-bottom:14px; }
  .info-card b{ color:var(--ink); }

  .undo-row{ display:flex; justify-content:flex-end; padding: 6px 16px 16px; }
  .undo-btn{ font-size:12px; color:var(--ink-faint); background:none; border:none; text-decoration:underline; cursor:pointer; padding:4px; }

  .week-grid{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:14px; overflow-x:auto; }
  table.wk{ width:100%; border-collapse:collapse; font-size:12px; }
  table.wk th{ font-weight:600; color:var(--ink-dim); padding:6px 4px; text-align:center; font-size:11px; }
  table.wk td{ text-align:center; padding:8px 4px; }
  table.wk td.label{ text-align:left; color:var(--ink-dim); font-size:12px; padding-right:8px; white-space:nowrap; }
  .dot{ width:16px; height:16px; border-radius:50%; margin:0 auto; border:1.5px solid var(--border); }
  .dot.on{ background:var(--sage); border-color:var(--sage); }
  .dot.today{ box-shadow: 0 0 0 2px var(--amber); }

  .streaks{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .streak-pill{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; flex:1; min-width:120px; text-align:center; }
  .streak-num{ font-family:'Fraunces',serif; font-size:22px; color:var(--amber); }
  .streak-lbl{ font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }

  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:11px; color:var(--ink-dim); }
  .field input{
    background:var(--surface-2); border:1px solid var(--border); color:var(--ink); border-radius:8px;
    padding:10px; font-size:14px; font-family:'IBM Plex Mono',monospace;
  }
  .field input:focus{ outline:none; border-color:var(--amber); }
  .btn-primary{
    background:var(--amber); color:#1A1508; border:none; border-radius:10px; padding:13px; font-weight:700;
    font-size:14px; width:100%; margin-top:14px; cursor:pointer;
  }
  .btn-secondary{
    background:none; color:var(--amber); border:1px solid var(--amber-dim); border-radius:10px; padding:12px;
    font-size:14px; width:100%; margin-top:10px; cursor:pointer; font-weight:600;
  }
  .save-msg{ text-align:center; font-size:12px; color:var(--sage); margin-top:8px; min-height:16px; }
  .history-item{ display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid var(--border); font-size:13px; }
  .history-item:first-child{ border-top:none; }
  .history-date{ color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; font-size:11.5px; }

  .q-row{ display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--border); }
  .q-row:first-child{ border-top:none; }
  .q-text{ flex:1; font-size:13px; }
  .q-text.done{ color:var(--ink-faint); text-decoration:line-through; }
  .q-del{ color:var(--ink-faint); background:none; border:none; cursor:pointer; font-size:16px; padding:2px 6px; }
  .q-add-row{ display:flex; gap:8px; margin-top:10px; }
  .q-add-row input{
    flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--ink); border-radius:8px;
    padding:10px; font-size:13px;
  }
  .q-add-btn{ background:var(--amber); color:#1A1508; border:none; border-radius:8px; padding:0 16px; font-weight:700; cursor:pointer; }

  .cal-nav{ display:flex; align-items:center; justify-content:space-between; padding:4px 4px 14px; }
  .cal-nav-btn{ width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; }
  .cal-nav-btn.disabled{ opacity:0.3; pointer-events:none; }
  .cal-month-label{ font-family:'Fraunces',serif; font-size:17px; text-transform:capitalize; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:12px; margin-bottom:8px; }
  .cal-dow{ text-align:center; font-size:10px; color:var(--ink-faint); text-transform:uppercase; padding-bottom:4px; }
  .cal-day{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer;
    font-size:12px; color:var(--ink-dim); border:1.5px solid transparent; position:relative; }
  .cal-day:hover{ background:var(--surface-2); }
  .cal-day.cal-partial{ border-color:var(--amber-dim); color:var(--ink); }
  .cal-day.cal-full{ background:var(--sage-dim); border-color:var(--sage); color:var(--ink); }
  .cal-day.cal-today{ box-shadow: 0 0 0 2px var(--amber); font-weight:700; color:var(--ink); }
  #cal-detail{ margin-top:6px; }

  .loading{ text-align:center; padding:40px; color:var(--ink-faint); font-size:13px; }
</style>
</head>

const GCAL_CLIENT_ID = "597690610927-qo47jp937va97bjbislrsi16vf67d8au.apps.googleusercontent.com";
let gcalTokenClient = null;
let gcalAccessToken = null;
let gcalReady = false;

function initGCal(){
  try{
    gapi.load('client', async () => {
      await gapi.client.init({});
      await gapi.client.load('https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest');
      gcalReady = true;
    });
    gcalTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GCAL_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/calendar.readonly',
      callback: (resp) => {
        if(resp.access_token){
          gcalAccessToken = resp.access_token;
          gapi.client.setToken({ access_token: gcalAccessToken });
          document.getElementById('gcal-btn').textContent = '📅 Conectado ✓';
          document.getElementById('gcal-btn').classList.add('active');
          refreshGCalViews();
        }
      },
    });
  }catch(e){ console.error('GCal init error', e); }
}
window.addEventListener('load', () => { setTimeout(initGCal, 800); });

function connectGoogleCalendar(){
  if(!gcalTokenClient){ alert('Google ainda carregando, tenta de novo em alguns segundos.'); return; }
  gcalTokenClient.requestAccessToken();
}

async function fetchGCalEvents(dateObj){
  if(!gcalAccessToken || !gcalReady) return null;
  const start = new Date(dateObj); start.setHours(0,0,0,0);
  const end = new Date(dateObj); end.setHours(23,59,59,999);
  try{
    const resp = await gapi.client.calendar.events.list({
      calendarId: 'primary',
      timeMin: start.toISOString(),
      timeMax: end.toISOString(),
      singleEvents: true,
      orderBy: 'startTime',
    });
    return resp.result.items || [];
  }catch(e){
    console.error('GCal fetch error', e);
    return null;
  }
}

function renderGCalBox(events){
  if(events === null) return '';
  if(events.length === 0) return `<div class="info-card" style="margin-bottom:12px;">📅 Sem eventos no Google Calendar hoje.</div>`;
  const rows = events.map(ev => {
    const time = ev.start.dateTime ? new Date(ev.start.dateTime).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : 'dia todo';
    return `<div style="display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--border);font-size:13px;"><span class="mono" style="color:var(--amber);min-width:52px;">${time}</span><span>${ev.summary || '(sem título)'}</span></div>`;
  }).join('');
  return `<div class="info-card" style="margin-bottom:12px;padding-top:8px;"><b>📅 Google Calendar</b>${rows}</div>`;
}

async function refreshGCalViews(){
  if(document.getElementById('view-hoje').classList.contains('active')){
    const events = await fetchGCalEvents(today);
    const el = document.getElementById('gcal-hoje');
    if(el) el.innerHTML = renderGCalBox(events);
  }
}

function tryUnlock(){
  const val = document.getElementById('pw').value;
  if(val === PASSWORD){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  } else {
    document.getElementById('gate-err').textContent = "Senha incorreta / Wrong password / パスワードが違います";
  }
}
document.getElementById('pw').addEventListener('keydown', e => { if(e.key === 'Enter') tryUnlock(); });

async function setLang(lang){
  currentLang = lang;

  try{ localStorage.setItem('gandini-settings', JSON.stringify({lang})); }catch(e){}

}

/* ---------------- DATE / DAY TYPE HELPERS ---------------- */
function fmtKey(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getDayType(d){
  const wd = d.getDay();
  if([1,3,5].includes(wd)) return 'treino';
  if([2,4].includes(wd)) return 'descanso';
  if(wd === 6) return 'sabado';
  return 'domingo';
}
function startOfWeek(d){
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const monday = new Date(d);
  monday.setDate(d.getDate() + diff);
  monday.setHours(0,0,0,0);
  return monday;
}

  const start = new Date(d.getFullYear(), 0, 0);
  const diff = d - start;
  return Math.floor(diff / 86400000);
}


function buildSections(date, lang){
  const t = T[lang];
  const type = getDayType(date);
  const wd = date.getDay();
  const sections = [];

  if(type === 'treino'){
    sections.push({ id:'wake', time:'5h', title:t.sec.wake, tasks:[{id:'acordar', label:t.task.acordar5}] });
    sections.push({ id:'espiritual', time:'5h05', title:t.sec.espiritual, tasks:[
      {id:'oracao', label:t.task.oracaoTreino},
      {id:'devocional', label:t.task.devocional10},
      {id:'meditacao', label:t.task.meditacao},
    ]});
    const letra = TREINO_LETRA[wd];
    const exList = WORKOUTS[letra].map(ex => ({
      id: `tr_${ex.id}`,
      label: exLabel(ex, lang),
      note: exNote(ex, lang),
    }));
    sections.push({ id:'treino', time:'5h25', title:`${t.sec.treino} ${letra}`, tasks: exList,
      groupIds: exList.map(e => e.id) });
  } else if(type === 'descanso'){
    sections.push({ id:'wake', time:'6h', title:t.sec.wake, tasks:[{id:'acordar', label:t.task.acordar6}] });
    sections.push({ id:'espiritual', time:'6h05', title:t.sec.espiritual, tasks:[
      {id:'oracao', label:t.task.oracaoSimples},
      {id:'devocional', label:t.task.devocionalSimples},
    ]});
    if(wd === 2){
      sections.push({ id:'pesagem', time:'', title:t.sec.pesagem, tasks:[
        {id:'pesagem', label:t.task.pesagem},
      ]});
    }
  } else if(type === 'sabado'){
    sections.push({ id:'wake', time:'6h', title:t.sec.wake, tasks:[{id:'acordar', label:t.task.acordar6}] });
    sections.push({ id:'espiritual', time:'', title:t.sec.espiritual, tasks:[
      {id:'oracao', label:t.task.oracaoSimples},
      {id:'devocional', label:t.task.devocionalSimples},
    ]});
    sections.push({ id:'jacob', time:'', title:t.sec.jacob, tasks:[
      {id:'jacob', label:t.task.jacob},
    ]});
  } else if(type === 'domingo'){
    sections.push({ id:'espiritual', time:'', title:t.sec.espiritual, tasks:[
      {id:'oracao', label:t.task.oracaoSimples},
      {id:'igreja', label:t.task.igreja},
    ]});
  }

  if(wd === 4 || wd === 5){
    sections.push({ id:'estudo', time:'13h', title:t.sec.estudo, tasks:[
      {id:'revego', label:t.task.revego},
    ], note: wd === 5 ? t.task.revegoNote : null });
  }

  const refeicaoTasks = [
    {id:'cafe', label:t.task.cafe, note:t.task.graca},
    {id:'lancheManha', label:t.task.lancheManha},
    {id:'almoco', label:t.task.almoco},
  ];
  if(wd !== 0 && wd !== 6){
    refeicaoTasks.push({id:'catalogue', label:t.task.catalogue});
  }
  refeicaoTasks.push(
    {id:'lancheTarde', label:t.task.lancheTarde},
    {id:'jantar', label:t.task.jantar, note:t.task.graca},
    {id:'ceia', label:t.task.ceia},
  );
  sections.push({ id:'refeicoes', time:'', title:t.sec.refeicoes, tasks:refeicaoTasks });

  const prayer = WEEKLY_PRAYER[wd];
  const bulletText = prayer.bullets[lang].map(b => `• ${b}`).join('  ');
  const doy = dayOfYear(date);
  const devoLabel = lang === 'pt' ? `Devocional do dia — dia ${doy} de "One Year Devotions for Men"`
    : lang === 'en' ? `Daily devotional — day ${doy} of "One Year Devotions for Men"`
    : `今日のデボーション — 『One Year Devotions for Men』${doy}日目`;
  sections.push({ id:'oracaoAlmoco', time:'12h', title:t.sec.oracaoAlmoco, tasks:[
    { id:'oracaoTema', label:`${prayer.title[lang]} — ${prayer.scripture[lang]}`, note: bulletText },
    { id:'devocionalAlmoco', label: devoLabel },
  ]});

  sections.push({ id:'agua', time:'', title:t.sec.agua, tasks:[], isWater:true });

  sections.push({ id:'suplementos', time:'', title:t.sec.suplementos, tasks:[
    {id:'fluoxetine', label:t.task.fluoxetine},
    {id:'anfetamina', label:t.task.anfetamina},
    {id:'vitD', label:t.task.vitD},
    {id:'creatina', label:t.task.creatina},
  ]});

  if([1,3,5].includes(wd)){
    const rotina = { 1:t.task.chiExcel, 3:t.task.chiLeitura, 5:t.task.chiLivre };
    sections.push({ id:'tempoChi', time:'', title:t.sec.tempoChi, tasks:[
      {id:'tempoChi', label: rotina[wd]},
    ]});
  }

  const dormirLabel = wd === 5 ? t.task.dormirFlex : (type === 'treino' ? t.task.dormir23 : t.task.dormirSimples);
  sections.push({ id:'winddown', time:'', title:t.sec.winddown, tasks:[
    {id:'winddown', label:t.task.winddown},
    {id:'dormir', label: dormirLabel},
  ]});

  return sections;
}

/* ---------------- RENDER HOJE ---------------- */
async function renderHoje(){
  const t = T[currentLang];
  const sections = buildSections(today, currentLang);
  const container = document.getElementById('hoje-content');
  container.innerHTML = '';
  container.classList.remove('loading');

  sections.forEach(sec => {
    const box = document.createElement('div');
    box.className = 'section';
    let headHTML = `<div class="section-head"><div class="st"><span class="section-title">${sec.title}</span></div>`;
    if(sec.time) headHTML += `<span class="time">${sec.time}</span>`;
    headHTML += `</div>`;
    box.innerHTML = headHTML;

    const body = document.createElement('div');
    body.className = 'section-body';

    if(sec.isWater){
      body.appendChild(renderWater());
    } else {
      sec.tasks.forEach(tk => body.appendChild(renderTaskRow(tk, sec.groupIds)));
    }
    if(sec.note){
      const n = document.createElement('div');
      n.className = 'task-note-inline';
      n.style.padding = '4px 0 8px 4px';
      n.textContent = sec.note;
      body.appendChild(n);
    }
    box.appendChild(body);
    container.appendChild(box);
  });

  updateArc();

  // Weekend catch-up — pulls the actual exercises from the missed day
  if(todayType === 'sabado' || todayType === 'domingo'){
    const recovery = await getWeekTreinoStatus(today);
    const pending = recovery.filter(r => !r.done);
    if(pending.length){
      const box = document.createElement('div');
      box.className = 'section';
      box.innerHTML = `<div class="section-head" id="recuperacao-head" style="cursor:pointer;user-select:none;"><div class="st"><span class="section-title">${t.sec.recuperacao}</span></div><span class="time" id="recuperacao-arrow">▸</span></div>`;
      const body = document.createElement('div');
      body.className = 'section-body';
      body.style.display = 'none';
      box.querySelector('#recuperacao-head').addEventListener('click', () => {
        const open = body.style.display !== 'none';
        body.style.display = open ? 'none' : 'block';
        box.querySelector('#recuperacao-arrow').textContent = open ? '▸' : '▾';
      });

      for(const r of pending){
        const rec = await getDay(r.key);
        const dLabel = `${DIAS[currentLang][r.dateObj.getDay()]} ${r.dateObj.getDate()}/${r.dateObj.getMonth()+1}`;
        const sub = document.createElement('div');
        sub.style.cssText = 'font-size:12px;color:var(--amber);text-transform:uppercase;letter-spacing:0.06em;margin:14px 0 4px;';
        sub.textContent = `${t.sec.treino} ${r.letra} — ${dLabel}`;
        body.appendChild(sub);

        WORKOUTS[r.letra].forEach(ex => {
          const exId = `tr_${ex.id}`;
          const done = !!rec[exId];
          const row = document.createElement('div');
          row.className = 'task-row' + (done ? ' done' : '');
          const noteTxt = exNote(ex, currentLang);
          let html = `<div class="task-row-main">
            <div class="check ${done ? 'done' : ''}">
              <svg viewBox="0 0 24 24" fill="none" stroke="#0C0F14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div class="task-label">${exLabel(ex, currentLang)}</div>
          </div>`;
          if(noteTxt) html += `<div class="task-note-inline">${noteTxt}</div>`;
          row.innerHTML = html;
          row.querySelector('.check').addEventListener('click', async () => {
            const fresh = await getDay(r.key);
            fresh[exId] = !fresh[exId];
            const allIds = WORKOUTS[r.letra].map(e => `tr_${e.id}`);
            fresh.treino = allIds.every(id => !!fresh[id]);
            await setDay(r.key, fresh);
            renderHoje();
          });
          body.appendChild(row);
        });
      }
      box.appendChild(body);
      container.appendChild(box);
    }
  }
}

async function getWeekTreinoStatus(date){
  const monday = startOfWeek(date);
  const defs = [ {offset:0, letra:'A'}, {offset:2, letra:'B'}, {offset:4, letra:'C'} ];
  const result = [];
  for(const d of defs){
    const dt = new Date(monday); dt.setDate(monday.getDate()+d.offset);
    const key = fmtKey(dt);
    const rec = await getDay(key);
    result.push({key, letra:d.letra, done: !!rec.treino, dateObj: dt});
  }
  return result;
}

function getChecked(taskId){ return !!dayData[taskId]; }
function setChecked(taskId, val){
  dayData[taskId] = val;
  setDay(todayKey, dayData);
  updateArc();
  renderSemanaIfActive();
}

function renderTaskRow(task, groupIds){
  const row = document.createElement('div');
  row.className = 'task-row' + (getChecked(task.id) ? ' done' : '');
  let html = `
    <div class="task-row-main">
      <div class="check ${getChecked(task.id) ? 'done' : ''}" data-task="${task.id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0C0F14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="task-label">${task.label}</div>
    </div>`;
  if(task.note){
    html += `<div class="task-note-inline">${task.note}</div>`;
  }
  row.innerHTML = html;
  const checkEl = row.querySelector('.check');
  checkEl.addEventListener('click', () => {
    const current = !!dayData[task.id];
    const newVal = !current;
    dayData[task.id] = newVal;
    setDay(todayKey, dayData);
    checkEl.classList.toggle('done', newVal);
    row.classList.toggle('done', newVal);
    updateArc();
    renderSemanaIfActive();
    if(groupIds){
      dayData.treino = groupIds.every(id => !!dayData[id]);
      setDay(todayKey, dayData);
    }
  });
  return row;
}

function renderWater(){
  const t = T[currentLang];
  const wrap = document.createElement('div');
  const ml = dayData.agua_ml || 0;
  const goal = 3500;
  wrap.innerHTML = `
    <div class="water-box">
      <div class="water-btn" id="water-minus">−</div>
      <div class="water-fill">
        <div class="water-bar"><div class="water-bar-in" id="water-bar-in" style="width:${Math.min(100,(ml/goal*100))}%"></div></div>
        <div class="water-txt" id="water-txt">${ml} / ${goal} ml</div>
      </div>
      <div class="water-btn" id="water-plus">+</div>
    </div>
  `;
  wrap.querySelector('#water-plus').addEventListener('click', () => adjustWater(250));
  wrap.querySelector('#water-minus').addEventListener('click', () => adjustWater(-250));
  return wrap;
}
function adjustWater(delta){
  let ml = (dayData.agua_ml || 0) + delta;
  if(ml < 0) ml = 0;
  dayData.agua_ml = ml;
  setDay(todayKey, dayData);
  const goal = 3500;
  document.getElementById('water-bar-in').style.width = Math.min(100, (ml/goal*100)) + '%';
  document.getElementById('water-txt').textContent = `${ml} / ${goal} ml`;
  updateArc();
  renderSemanaIfActive();
}

function updateArc(){
  const sections = buildSections(today, currentLang);
  let total = 0, done = 0;
  sections.forEach(sec => {
    if(sec.isWater){
      total += 1;
      if((dayData.agua_ml||0) >= 3500) done += 1;
    } else {
      sec.tasks.forEach(tk => { total += 1; if(getChecked(tk.id)) done += 1; });
    }
  });
  const pct = total ? Math.round((done/total)*100) : 0;
  const circumference = 235.6;
  const offset = circumference - (circumference * pct / 100);
  document.getElementById('arc-fill').style.strokeDashoffset = offset;
  document.getElementById('arc-pct-txt').textContent = pct + '%';
}

let calMonth = new Date(today.getFullYear(), today.getMonth(), 1);
const CAL_MAX = new Date(2026, 11, 31);

function navMonth(delta){
  const nm = new Date(calMonth.getFullYear(), calMonth.getMonth()+delta, 1);
  if(nm > CAL_MAX) return;
  calMonth = nm;
  renderCalendarGrid();

async function renderCalendarGrid(){
  document.getElementById('cal-month-label').textContent = `${MESES[currentLang][calMonth.getMonth()]} ${calMonth.getFullYear()}`;
  const nextMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1);
  document.getElementById('cal-next-btn').classList.toggle('disabled', nextMonth > CAL_MAX);

  const daysInMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 0).getDate();
  const firstDay = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
  let startOffset = firstDay.getDay();
  startOffset = startOffset === 0 ? 6 : startOffset - 1;

  const dateObjs = [];
  for(let d=1; d<=daysInMonth; d++) dateObjs.push(new Date(calMonth.getFullYear(), calMonth.getMonth(), d));
  const dataList = await Promise.all(dateObjs.map(d => getDay(fmtKey(d))));

  const dowShort = { pt:['S','T','Q','Q','S','S','D'], en:['M','T','W','T','F','S','S'], ja:['月','火','水','木','金','土','日'] }[currentLang];

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  dowShort.forEach(l => {
    const h = document.createElement('div'); h.className='cal-dow'; h.textContent = l; grid.appendChild(h);
  });
  for(let i=0;i<startOffset;i++){ grid.appendChild(document.createElement('div')); }

  dateObjs.forEach((d, idx) => {
    const dt = dataList[idx];
    const sections = buildSections(d, currentLang);
    let total = 0, done = 0;
    sections.forEach(sec => {
      if(sec.isWater){ total += 1; if((dt.agua_ml||0) >= 3500) done += 1; }
      else sec.tasks.forEach(tk => { total += 1; if(dt[tk.id]) done += 1; });
    });
    const pct = total ? done/total : 0;
    const cell = document.createElement('div');
    cell.className = 'cal-day';
    if(fmtKey(d) === todayKey) cell.classList.add('cal-today');
    if(pct >= 0.99) cell.classList.add('cal-full');
    else if(pct > 0) cell.classList.add('cal-partial');
    cell.innerHTML = `<span>${d.getDate()}</span>`;
    cell.addEventListener('click', () => renderDayDetail(d));
    grid.appendChild(cell);
  });
}

    {key:'treino', label:t.streak.treino},
    {key:'suplementosOk', label:t.streak.suplementos},

  const streaks = {};

    for(let i=0;i<60;i++){
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      const dt = i===0 ? dayData : await getDay(fmtKey(d));
      const type = getDayType(d);
      let ok;
      if(cat.key === 'treino'){
        if(type !== 'treino') continue;
        ok = !!dt['treino'];
      } else if(cat.key === 'suplementosOk'){
        ok = dt.fluoxetine && dt.anfetamina && dt.vitD && dt.creatina;
      } else {
        ok = !!dt[cat.key];
      }
      if(ok) count++;
      else break;
    }
    streaks[cat.key] = count;
  }

  let html = '<div class="streaks">';
  streakCats.forEach(c => {
    html += `<div class="streak-pill"><div class="streak-num">🔥 ${streaks[c.key]}</div><div class="streak-lbl">${c.label}</div></div>`;
  });
  html += '</div>';

  const HABIT_ROWS = [
    { key:'oracao', label:t.streak.oracao },
    { key:'treino', label:t.streak.treino },
    { key:'aguaOk', label:t.water.label.split(' —')[0] },
    { key:'suplementosOk', label:t.streak.suplementos },
    { key:'tempoChi', label:t.sec.tempoChi },
  ];

  html += '<div class="week-grid"><table class="wk"><thead><tr><th style="text-align:left;">&nbsp;</th>';
  weekDates.forEach(d => {
    html += `<th>${DIAS[currentLang][d.getDay()].slice(0,3)}<br><span class="mono" style="font-size:10px;color:var(--ink-faint)">${d.getDate()}</span></th>`;
  });
  html += '</tr></thead><tbody>';

  HABIT_ROWS.forEach(row => {
    html += `<tr><td class="label">${row.label}</td>`;
    weekDates.forEach((d, idx) => {
      const dt = weekData[idx];
      const type = getDayType(d);
      let on = false, applicable = true;
      if(row.key === 'treino'){ applicable = type === 'treino'; on = !!dt['treino']; }
      else if(row.key === 'aguaOk'){ on = (dt.agua_ml||0) >= 3500; }
      else if(row.key === 'suplementosOk'){ on = dt.fluoxetine && dt.anfetamina && dt.vitD && dt.creatina; }
      else if(row.key === 'tempoChi'){ applicable = [1,3,5].includes(d.getDay()); on = !!dt['tempoChi']; }
      else { on = !!dt[row.key]; }

      const isToday = fmtKey(d) === todayKey;
      if(!applicable){
        html += `<td><span style="color:var(--ink-faint);font-size:11px;">–</span></td>`;
      } else {
        html += `<td><div class="dot ${on ? 'on' : ''} ${isToday ? 'today' : ''}"></div></td>`;
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  container.innerHTML = html;
}

/* ---------------- MEDIDAS ---------------- */
const LEMBRETE_DEFAULT = 'Magnésio, Zinco, Ômega 3, Vitamina B12, Apple Cider Vinegar (cápsulas), Coenzima Q10 — viabilidade e dosagem, considerando Fluoxetine e Anfetamina em uso.';

function getLembreteText(){
  try{
    const v = localStorage.getItem('gandini-lembrete');
    return v !== null ? v : LEMBRETE_DEFAULT;
  }catch(e){ return LEMBRETE_DEFAULT; }
}
function loadLembreteField(){
  document.getElementById('lembrete-text').value = getLembreteText();
}
function salvarLembrete(){
  const t = T[currentLang];
  try{
    localStorage.setItem('gandini-lembrete', document.getElementById('lembrete-text').value);
    document.getElementById('lembrete-msg').style.color = 'var(--sage)';
    document.getElementById('lembrete-msg').textContent = t.lembreteSaved;
  }catch(e){
    document.getElementById('lembrete-msg').style.color = 'var(--coral)';
    document.getElementById('lembrete-msg').textContent = t.errMsg;
  }
}

function limparCamposMedida(){
  ['m-peso','m-cintura','m-abdomen','m-quadril','m-pescoco','m-braco','m-coxa','m-panturrilha'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('m-msg').textContent = '';
}

async function deletarMedida(dataKey){
  const t = T[currentLang];
  if(!confirm(t.confirmDeleteMedida)) return;
  try{ localStorage.removeItem(`gandini-medidas:${dataKey}`); }catch(e){}
  renderHistorico();
}

async function salvarMedida(){
  const t = T[currentLang];
  const data = document.getElementById('m-data').value || todayKey;
  const entry = {
    data,
    peso: document.getElementById('m-peso').value,
    cintura: document.getElementById('m-cintura').value,
    abdomen: document.getElementById('m-abdomen').value,
    quadril: document.getElementById('m-quadril').value,
    pescoco: document.getElementById('m-pescoco').value,
    braco: document.getElementById('m-braco').value,
    coxa: document.getElementById('m-coxa').value,
    panturrilha: document.getElementById('m-panturrilha').value,
  };
  try{
    localStorage.setItem(`gandini-medidas:${data}`, JSON.stringify(entry));
    document.getElementById('m-msg').style.color = 'var(--sage)';
    document.getElementById('m-msg').textContent = t.savedMsg;
    renderHistorico();
  }catch(e){
    document.getElementById('m-msg').style.color = 'var(--coral)';
    document.getElementById('m-msg').textContent = t.errMsg;
  }
}

async function getAllHistorico(){
  const keys = Object.keys(localStorage).filter(k => k.startsWith('gandini-medidas:')).sort().reverse();
  const entries = keys.map(k => JSON.parse(localStorage.getItem(k)));
  return entries;
}

async function renderHistorico(){
  const t = T[currentLang];
  const el = document.getElementById('m-history');
  el.innerHTML = '<div class="loading">…</div>';
  try{
    const entries = (await getAllHistorico()).slice(0, 20);
    if(entries.length === 0){
      el.innerHTML = `<div style="color:var(--ink-faint);font-size:13px;">${t.noHistory}</div>`;
      return;
    }
    el.innerHTML = entries.map(e => `
      <div class="history-item">
        <span class="history-date">${e.data}</span>
        <span style="display:flex;align-items:center;gap:8px;">
          ${e.peso ? e.peso+'kg' : '—'} · ${T[currentLang].lblCintura.split(' ')[0]} ${e.cintura||'—'}cm
          <button class="q-del" onclick="deletarMedida('${e.data}')">×</button>
        </span>
      </div>
    `).join('');
  }catch(e){
    el.innerHTML = `<div style="color:var(--ink-faint);font-size:13px;">${t.noHistory}</div>`;
  }
}

/* ---------------- PERGUNTAS (ad-hoc questions) ---------------- */
async function getPerguntas(){
  try{
    const v = localStorage.getItem('gandini-perguntas-list');
    return v ? JSON.parse(v) : [];
  }catch(e){ return []; }
}
async function setPerguntas(list){
  try{ localStorage.setItem('gandini-perguntas-list', JSON.stringify(list)); }catch(e){}
}
async function addPergunta(){
  const input = document.getElementById('q-new');
  const text = input.value.trim();
  if(!text) return;
  const list = await getPerguntas();
  list.unshift({ text, asked:false, id: Date.now() });
  await setPerguntas(list);
  input.value = '';
  renderPerguntas();
}
async function togglePergunta(id){
  const list = await getPerguntas();
  const item = list.find(i => i.id === id);
  if(item) item.asked = !item.asked;
  await setPerguntas(list);
  renderPerguntas();
}
async function delPergunta(id){
  let list = await getPerguntas();
  list = list.filter(i => i.id !== id);
  await setPerguntas(list);
  renderPerguntas();
}
async function renderPerguntas(){
  const t = T[currentLang];
  const el = document.getElementById('perguntas-list');
  const list = await getPerguntas();
  if(list.length === 0){
    el.innerHTML = `<div style="color:var(--ink-faint);font-size:13px;">${t.noQuestions}</div>`;
    return;
  }
  el.innerHTML = list.map(item => `
    <div class="q-row">
      <div class="check ${item.asked ? 'done' : ''}" onclick="togglePergunta(${item.id})">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0C0F14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="q-text ${item.asked ? 'done' : ''}">${item.text}</div>
      <button class="q-del" onclick="delPergunta(${item.id})">×</button>
    </div>
  `).join('');
}

function gerarPDF(){
  (async () => {
    const t = T.pt; // PDF sempre em português — vai pra nutricionista brasileira
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const data = document.getElementById('m-data').value || todayKey;
    const pageH = doc.internal.pageSize.height;
    let y = 20;

    function ensureSpace(next){ if(y + next > pageH - 15){ doc.addPage(); y = 20; } }
    function heading(text){ ensureSpace(12); doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text(text, 20, y); y += 8; doc.setFont('helvetica','normal'); doc.setFontSize(10); }
    function line(text){ ensureSpace(7); doc.text(text, 20, y); y += 6.5; }

    try{
      doc.addImage(`data:image/png;base64,${LOGO_BASE64}`, 'PNG', 150, 12, 40, 51);
    }catch(e){ console.error('logo pdf error', e); }

    doc.setFont('helvetica','bold');
    doc.setFontSize(16);
    doc.text(t.pdfHeader, 20, y); y += 8;
    doc.setFontSize(10); doc.setFont('helvetica','normal');
    doc.text(`${t.pdfData}: ${data}`, 20, y); y += 10;

    heading('Medidas');
    const rows = [
      [t.lblPeso, document.getElementById('m-peso').value],
      [t.lblCintura, document.getElementById('m-cintura').value],
      [t.lblAbdomen, document.getElementById('m-abdomen').value],
      [t.lblQuadril, document.getElementById('m-quadril').value],
      [t.lblPescoco, document.getElementById('m-pescoco').value],
      [t.lblBraco, document.getElementById('m-braco').value],
      [t.lblCoxa, document.getElementById('m-coxa').value],
      [t.lblPanturrilha, document.getElementById('m-panturrilha').value],
    ];
    rows.forEach(r => {
      ensureSpace(7);
      doc.setFont('helvetica','bold'); doc.text(r[0] + ':', 20, y);
      doc.setFont('helvetica','normal'); doc.text(r[1] || '—', 90, y);
      y += 7;
    });
    y += 4;

    heading(t.pdfLembrete);
    const lembreteText = getLembreteText();
    const lembreteLines = doc.splitTextToSize(lembreteText, 170);
    lembreteLines.forEach(l => line(l));
    y += 4;

    heading(t.pdfPerguntas);
    const perguntas = await getPerguntas();
    if(perguntas.length === 0){
      line('—');
    } else {
      perguntas.forEach(p => {
        const status = p.asked ? t.pdfAsked : t.pdfPending;
        const lines = doc.splitTextToSize(`• ${p.text} ${status}`, 170);
        lines.forEach(l => line(l));
      });
    }
    y += 4;

    heading(t.pdfHistorico);
    const historico = await getAllHistorico();
    if(historico.length === 0){
      line('—');
    } else {
      historico.forEach(e => {
        line(`${e.data} — peso: ${e.peso||'—'}kg · cintura: ${e.cintura||'—'}cm · abdômen: ${e.abdomen||'—'}cm · quadril: ${e.quadril||'—'}cm`);
      });
    }

    ensureSpace(14);
    y += 6;
    doc.setFont('helvetica','italic'); doc.setFontSize(9);
    doc.text(t.pdfFooter, 20, y);

    doc.save(`gandini-medidas-${data}.pdf`);
  })();
}
